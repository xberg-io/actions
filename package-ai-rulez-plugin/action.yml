name: Package AI-Rulez Plugin
description: Build deterministic verified plugin archives, checksums and marketplace indexes using an installed AI-Rulez CLI.
inputs:
  tag:
    description: Release tag required to pin a marketplace to this commit.
    required: true
    default: ${{ github.ref_name }}
  version-sync-script:
    description: Plugin version sync script supporting a read-only --check flag.
    required: false
    default: "scripts/sync_plugin_version.py"
  config-directory:
    description: Plugin authoring configuration directory relative to working-directory.
    required: false
    default: ".ai-rulez"
  cursor-marketplace:
    description: Also export a Cursor team marketplace; every bundled plugin must include the Cursor runtime.
    required: false
    default: "false"
  working-directory:
    description: Working directory containing a clean committed release tree.
    required: false
    default: "."
  dist-directory:
    description: Release artifact directory relative to working-directory.
    required: false
    default: "dist/plugin"
outputs:
  dist-directory:
    description: Release artifact directory relative to working-directory.
    value: ${{ inputs.dist-directory }}
runs:
  using: composite
  steps:
    - name: Verify plugin version tracks core
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        VERSION_SYNC_SCRIPT: ${{ inputs.version-sync-script }}
      run: python3 "$VERSION_SYNC_SCRIPT" --check
    - name: Package and verify release artifacts
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        CONFIG_DIRECTORY: ${{ inputs.config-directory }}
        DIST_DIRECTORY: ${{ inputs.dist-directory }}
        RELEASE_TAG: ${{ inputs.tag }}
        CURSOR_MARKETPLACE: ${{ inputs.cursor-marketplace }}
      run: |
        test -n "$CONFIG_DIRECTORY"
        test -n "$DIST_DIRECTORY"
        test -n "$RELEASE_TAG"
        emit_args=(--emit agent-plugins)
        case "${CURSOR_MARKETPLACE:-false}" in
          true) emit_args+=(--emit cursor-team-marketplace) ;;
          false) ;;
          *) echo 'cursor-marketplace must be true or false' >&2; exit 1 ;;
        esac
        ai-rulez -C "$CONFIG_DIRECTORY" publish --dist "$DIST_DIRECTORY" --tag "$RELEASE_TAG" --marketplace --sbom "${emit_args[@]}"
        ai-rulez publish verify "$DIST_DIRECTORY"
