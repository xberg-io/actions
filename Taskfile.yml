version: "3"

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  setup:
    desc: Install pre-commit hooks and dev environment
    cmds:
      - uv lock --check || uv lock
      - uv sync --group dev
      - command -v poly >/dev/null 2>&1 || brew install goldziher/tap/poly
      - task: governance:hooks:install

  update:
    desc: Update pre-commit hooks and dependencies
    cmds:
      - uv sync --group dev --upgrade
      - gh-actions-updater --update .

  lint:
    desc: Run all linters and formatting checks via poly
    cmds:
      - poly lint .
      - poly fmt --check .
      - task: lint:bats

  typecheck:
    desc: Check Python types with Pyrefly
    cmds:
      - uv run --frozen pyrefly check . --verbose --project-excludes 'tests/**' --project-excludes '**/tests/**'

  test:
    desc: Run all tests
    cmds:
      - task: test:unit
      - task: test:bats
      - task: test:pester

  test:ai-rulez-plugin:
    desc: Test plugin freshness gates and deterministic release artifacts
    cmds:
      - uv run pytest tests/test_ai_rulez_plugin.py -v

  test:ai-rulez-validation:
    desc: Test strict governance validation and artifact freshness gates
    cmds:
      - uv run pytest tests/test_validate_ai_rulez.py -v

  test:unit:
    desc: Run pytest unit tests
    cmds:
      - uv run pytest -v

  test:bats:
    desc: Run Bats tests for Bash action scripts
    env:
      # Suites resolve the shared helpers with `bats_load_library xberg-bats`, which searches
      # BATS_LIB_PATH and nothing else. CI passes the same directory to run-bats via lib-path.
      BATS_LIB_PATH: "{{.ROOT_DIR}}/bats-lib"
    cmds:
      - bats --recursive --print-output-on-failure .

  test:pester:
    desc: Run Pester suites for PowerShell action scripts
    vars:
      # The same pin .github/workflows/test-pester.yml passes to install-pester, so a local run
      # and a CI run exercise the same Pester. ~keep
      PESTER_VERSION: "6.2.0"
    preconditions:
      - sh: command -v pwsh
        msg: pwsh is required for the Pester suites. Install PowerShell 7 or newer.
      - sh: >-
          pwsh -NoProfile -Command
          'exit [int](@(Get-Module -ListAvailable Pester).Version -notcontains [version]"{{.PESTER_VERSION}}")'
        msg: >-
          Pester {{.PESTER_VERSION}} is missing. Install it with:
          Install-Module Pester -RequiredVersion {{.PESTER_VERSION}} -Scope CurrentUser
    cmds:
      # -PassThru and an explicit exit: a plain Invoke-Pester prints the failures and still
      # returns 0, which would leave this task green with a red suite. ~keep
      #
      # Suites are DISCOVERED, not listed. `bats --recursive .` picks up a new action's tests with
      # zero registration and Pester must behave the same way -- a hand-maintained path list is
      # how a suite ends up written, committed, and never run. `git ls-files` also keeps .venv and
      # every other untracked tree out of the walk without needing an exclude list. ~keep
      - |
        pwsh -NoProfile -Command '
          $suites = @(git ls-files "*.Tests.ps1")
          if ($suites.Count -eq 0) { throw "no *.Tests.ps1 suites found" }
          exit (Invoke-Pester -Path $suites -Output Detailed -PassThru).FailedCount'

  lint:bats:
    desc: Format-check and lint Bats suites
    cmds:
      # poly has no engine for the .bats extension, so these files are invisible to `poly lint`.
      # shfmt 3.14 has a bats dialect and shellcheck parses `@test "x" { }` as bash, so both
      # tools work here -- they just have to be invoked directly.
      #
      # Four codes are disabled, all of them structural to how Bats suites are written:
      #   SC2016/SC2183  a stub body is single-quoted on purpose -- the expansion and the format
      #                  string belong to the STUB, which runs later, not to the line writing it.
      #   SC2030/SC2031  `run` forks, so shellcheck sees every export in setup() as "modified in
      #                  a subshell". That fork is real and load-bearing (it is why a suite must
      #                  call an exporting function directly rather than through `run`), but the
      #                  warning fires on correct code 62 times and cannot distinguish the two.
      # Everything else stays on. ~keep
      - 'shfmt -ln bats -d $(git ls-files "*.bats")'
      - 'shellcheck -s bash -e SC2016,SC2183,SC2030,SC2031 $(git ls-files "*.bats")'

  test:act:
    desc: Run a specific test workflow locally (usage{{":"}} task test:act -- test-setup-rust.yml)
    cmds:
      - act -W .github/workflows/{{.CLI_ARGS}}

  validate:
    desc: Run lint (poly handles actionlint + shellcheck + shfmt)
    cmds:
      - task: lint

  governance:hooks:install:
    desc: Provision machine preferences and install reviewed AI governance hooks
    cmds:
      - |
        python3 - <<'PYTHON'
        import pathlib
        import shutil
        import subprocess
        import tomllib

        if shutil.which("ai-rulez") is None:
            raise SystemExit("Install the reviewed ai-rulez CLI before installing hooks")
        preferences = pathlib.Path("poly.local.toml")
        text = preferences.read_text() if preferences.exists() else ""
        data = tomllib.loads(text)
        if "hook_preferences" not in data:
            preferences.write_text(text.rstrip() + '\n\n[hook_preferences]\nchannels = ["system"]\n')
        elif "system" not in data["hook_preferences"].get("channels", []):
            raise SystemExit("Add system to hook_preferences.channels in poly.local.toml")
        subprocess.run(["poly", "hooks", "install"], check=True)
        PYTHON

  governance:check:
    desc: Check materialized local governance outputs against shared sources
    cmds:
      - ai-rulez generate --check --no-local --strict-config
