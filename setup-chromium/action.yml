name: Setup Chromium
description: >
  Install non-snap Chromium for headless browser e2e tests. Uses Playwright's
  browser installer to provision a Chromium binary that accepts all CLI flags
  (--no-sandbox, --headless, --disable-features, etc.) — required on Ubuntu
  runners where the default `chromium` package is a snap wrapper that rejects
  Chromium flags. Outputs the absolute binary path for consumers.

outputs:
  chromium-path:
    description: Absolute path to the Chromium binary
    value: ${{ steps.install.outputs.chromium-path }}

runs:
  using: composite
  steps:
    - name: Check for mise
      id: mise
      shell: bash
      run: echo "present=$(command -v mise >/dev/null 2>&1 && echo true || echo false)" >>"$GITHUB_OUTPUT"

    - name: Set up mise
      if: steps.mise.outputs.present != 'true'
      uses: xberg-io/actions/setup-mise@v1
      with:
        install: "false"

    - name: Install Node.js through mise
      shell: bash
      env:
        MISE_GITHUB_TOKEN: ${{ env.MISE_GITHUB_TOKEN || github.token }}
      run: bash "${{ github.action_path }}/../setup-mise/scripts/install-tools.sh" . node

    - name: Install Chromium via Playwright
      id: install
      shell: bash
      run: bash "${{ github.action_path }}/scripts/install.sh"

    - name: Verify Chromium accepts headless flags
      if: runner.os != 'Windows'
      shell: bash
      env:
        CHROMIUM_PATH: ${{ steps.install.outputs.chromium-path }}
      run: |
        set -euo pipefail
        "$CHROMIUM_PATH" --version
        "$CHROMIUM_PATH" \
          --headless=new \
          --no-sandbox \
          --disable-features=TranslateUI \
          --dump-dom \
          about:blank > /dev/null

    # ~keep chrome.exe ignores --version and starts a browser that never exits, which hung this step for the
    # ~keep whole 6h job limit; read the version from the file metadata and bound the headless run instead.
    - name: Verify Chromium accepts headless flags (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        CHROMIUM_PATH: ${{ steps.install.outputs.chromium-path }}
      run: |
        $ErrorActionPreference = 'Stop'
        Write-Host "Chromium $((Get-Item $env:CHROMIUM_PATH).VersionInfo.ProductVersion)"
        $arguments = '--headless=new', '--no-sandbox', '--disable-features=TranslateUI', '--dump-dom', 'about:blank'
        $process = Start-Process -FilePath $env:CHROMIUM_PATH -ArgumentList $arguments -PassThru -NoNewWindow `
          -RedirectStandardOutput (Join-Path $env:RUNNER_TEMP 'chromium-dump.html')
        # ~keep Reading Handle caches it, without which ExitCode stays null after WaitForExit.
        $null = $process.Handle
        if (-not $process.WaitForExit(120000)) {
          & taskkill.exe /T /F /PID $process.Id
          throw 'Chromium did not exit within 120s of a headless --dump-dom run'
        }
        if ($process.ExitCode -ne 0) { throw "Chromium headless run exited with $($process.ExitCode)" }
