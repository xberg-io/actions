
version = "5.0"
name = 'actions'
description = 'Shared GitHub Actions composite actions for xberg-io CI/CD pipelines'
gitignore = true
presets = ["claude", "codex", "opencode", "pi"]
builtins = ['cicd', 'default-commands']

compact = true
[[includes]]
name = 'xberg-core'
source = 'https://github.com/xberg-io/agent-conventions.git'
path = 'modules/core'
merge_strategy = 'local-override'

[[includes]]
name = 'xberg-cicd'
source = 'https://github.com/xberg-io/agent-conventions.git'
path = 'modules/cicd'
merge_strategy = 'local-override'

[[marketplaces]]
name = "basemind"
source = "Goldziher/basemind"
type = "github"

[[plugins]]
marketplace = "basemind"
name = "basemind"
scope = "project"
enabled = true

# Pinned by `ai-rulez migrate v5`: the 4.x default. Remove this line to take the v5 default.
[header]
text = """AI-RULEZ :: GENERATED FILE - DO NOT EDIT
Source: .ai-rulez/config.toml
Modify .ai-rulez/ content and regenerate with pnpm dlx ai-rulez@5.0.1 generate
MCP server: pnpm dlx ai-rulez@5.0.1 mcp"""
hashes = "full"

[mcp]
self_server_command = ["pnpm", "dlx", "ai-rulez@5.0.1", "mcp"]
