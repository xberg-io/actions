
version = "5.0"
name = 'actions'
description = 'Shared GitHub Actions composite actions for xberg-io CI/CD pipelines'
gitignore = true
# ~keep The manifest is committed so CI can detect stale generated files.
gitignore_exclude = [".ai-rulez/.generated-manifest.json"]
presets = ["claude", "codex", "opencode", "pi", "hermes"]
builtins = ["!agent-delegation", "!git-workflow", "default-commands"]

default_layers = ["plugins"]
compact = true
[[includes]]
name = 'xberg-core'
source = 'https://github.com/xberg-io/agent-conventions.git'
ref = "923818e1ce9b71ebe68306c7a551caeaf7b27106"
path = 'modules/core'
merge_strategy = 'local-override'

[[includes]]
name = 'xberg-languages'
source = 'https://github.com/xberg-io/agent-conventions.git'
ref = "923818e1ce9b71ebe68306c7a551caeaf7b27106"
path = 'modules/languages'
merge_strategy = 'local-override'

[[includes]]
name = 'xberg-cicd'
source = 'https://github.com/xberg-io/agent-conventions.git'
ref = "923818e1ce9b71ebe68306c7a551caeaf7b27106"
path = 'modules/cicd'
merge_strategy = 'local-override'

[mcp]
self_server_command = ["ai-rulez", "mcp"]
# ~keep Skill discovery only: the full server lists 67 tools (~38k tokens of schema) at every session start.
serve_skills = true
read_only = true
discover_skills = "repo"
tools = ["find_skill", "load_skill"]

[[mcp_servers]]
name = "playwright"
command = "npx"
args = ["-y", "@playwright/mcp@0.0.83"]

[lint]
allow_overrides = ["testing-conventions"]

[lock]
include_outputs = false

[rules]
# ~keep Glob-scoped rules stay out of AGENTS.md: rule files for Claude, path-gated skills for Codex.
scoped_fallback = "skill"
