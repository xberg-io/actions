name: Publish to Maven Central
description: >
  Deploy Maven artifacts to Maven Central with GPG signing.
  Handles already-published versions idempotently.

  Auth via env: `MAVEN_USERNAME`, `MAVEN_PASSWORD` (Sonatype Central Portal
  user token), `MAVEN_GPG_PASSPHRASE`. The GPG private key is imported from
  the `MAVEN_GPG_PRIVATE_KEY` env var. Accepts both ASCII-armored format
  (`-----BEGIN PGP PRIVATE KEY BLOCK-----`) and base64-encoded armored
  (auto-detected). If the GPG key is already in the keyring (e.g. you ran
  `actions/setup-java` with `gpg-private-key`), leave `MAVEN_GPG_PRIVATE_KEY`
  unset and this action will skip the import step.

inputs:
  pom-file:
    description: "Path to pom.xml file"
    required: false
    default: "pom.xml"
  maven-profile:
    description: "Maven profile to activate for publishing"
    required: false
    default: "publish"
  extra-args:
    description: "Additional Maven arguments (space-separated)"
    required: false
    default: ""
  setup-java:
    description: >
      Install Java through mise and write the `<server id="${server-id}">`
      entry of `~/.m2/settings.xml` with the `MAVEN_USERNAME` /
      `MAVEN_PASSWORD` env-var references, as `actions/setup-java` did. Set
      to `false` if the caller already set up Java and that entry.
    required: false
    default: "true"
  java-version:
    description: >-
      JDK version to install through mise, prefixed with `java-distribution` (e.g. "25" selects the newest locked
      temurin-25). Empty uses the Java the caller's mise.toml selects. Ignored when `setup-java=false`.
    required: false
    default: ""
  java-distribution:
    description: "JDK distribution prefixed to `java-version` (ignored when `java-version` is empty or `setup-java=false`)"
    required: false
    default: "temurin"
  server-id:
    description: >
      Server id used by the publishing-maven-plugin (must match
      `<publishingServerId>` in the project's pom.xml). Maven Central via
      the Sonatype Central Portal canonically uses `ossrh`; the newer
      `central-publishing-maven-plugin` defaults to `central`. `setup-java`
      writes a `<server id="${server-id}">` block keyed on the
      `MAVEN_USERNAME` / `MAVEN_PASSWORD` env vars.
    required: false
    default: "ossrh"
  dry-run:
    description: "Perform a dry run without actually publishing"
    required: false
    default: "false"
  expected-version:
    description: >
      Version of the release being published (a leading `v` is stripped). When set, the POM about
      to be deployed must carry this version, and an "already exists" response from Maven Central
      must name this version, or the action fails before the deploy. Leaving it empty preserves
      the old behaviour but disables the stale-artifact guard, and the action warns loudly.
    required: false
    default: ""

  required-notice-files:
    description: >
      Newline-separated canonical filenames. Enables final-byte guarded publication: the audited
      Central 0.12.0 release provider builds with skipUpload, then the verified bundle is uploaded once.
      Requires expected-version; supports one component with main, sources and javadoc JARs.
    required: false
    default: ""
  canonical-root:
    description: "Directory containing the canonical required-notice-files"
    required: false
    default: "."

runs:
  using: composite
  steps:
    - name: Check for mise
      id: mise
      if: inputs.setup-java == 'true'
      shell: bash
      run: echo "present=$(command -v mise >/dev/null 2>&1 && echo true || echo false)" >>"$GITHUB_OUTPUT"

    - name: Set up mise
      if: inputs.setup-java == 'true' && steps.mise.outputs.present != 'true'
      uses: xberg-io/actions/setup-mise@v1
      with:
        install: "false"

    - name: Install Java through mise
      if: inputs.setup-java == 'true'
      shell: bash
      env:
        JAVA_SPEC: ${{ inputs.java-version != '' && format('{0}-{1}', inputs.java-distribution, inputs.java-version) || '' }}
        MISE_GITHUB_TOKEN: ${{ env.MISE_GITHUB_TOKEN || github.token }}
      run: bash "$GITHUB_ACTION_PATH/../setup-mise/scripts/install-tools.sh" . "java=$JAVA_SPEC"

    - name: Write the Maven server settings
      if: inputs.setup-java == 'true'
      shell: bash
      env:
        INPUT_SERVER_ID: ${{ inputs.server-id }}
      run: python3 "$GITHUB_ACTION_PATH/scripts/server_settings.py"

    - name: Import GPG key
      if: env.MAVEN_GPG_PRIVATE_KEY != ''
      shell: bash
      env:
        MAVEN_GPG_PRIVATE_KEY: ${{ env.MAVEN_GPG_PRIVATE_KEY }}
        MAVEN_GPG_PASSPHRASE: ${{ env.MAVEN_GPG_PASSPHRASE }}
      run: |
        # Try importing as raw (armored) first; on failure, try base64-decoded.
        # GH Actions log-masks any substring that matches a registered secret,
        # so prefix-detection via a literal armor-header grep is brittle.
        # Trying both forms unconditionally is simpler and more robust.
        gpg_err=$(mktemp)
        if printf '%s' "$MAVEN_GPG_PRIVATE_KEY" | gpg --batch --import 2>"$gpg_err"; then
          echo "Imported MAVEN_GPG_PRIVATE_KEY as armored OpenPGP"
        elif printf '%s' "$MAVEN_GPG_PRIVATE_KEY" | base64 -d 2>/dev/null | gpg --batch --import 2>"$gpg_err"; then
          echo "Imported MAVEN_GPG_PRIVATE_KEY (base64-decoded)"
        else
          echo "Error: MAVEN_GPG_PRIVATE_KEY could not be imported as armored OpenPGP or base64-encoded OpenPGP." >&2
          echo "gpg output from last attempt:" >&2
          sed 's/^/  /' "$gpg_err" >&2
          exit 1
        fi
        rm -f "$gpg_err"
        # Make the key usable for non-interactive signing
        for fpr in $(gpg --list-secret-keys --with-colons | awk -F: '$1 == "fpr" {print $10; exit}'); do
          echo "$fpr:6:" | gpg --import-ownertrust
        done

    - name: Deploy to Maven Central
      shell: bash
      env:
        MAVEN_GPG_PASSPHRASE: ${{ env.MAVEN_GPG_PASSPHRASE }}
        MAVEN_USERNAME: ${{ env.MAVEN_USERNAME }}
        MAVEN_PASSWORD: ${{ env.MAVEN_PASSWORD }}
        INPUT_POM_FILE: ${{ inputs.pom-file }}
        INPUT_MAVEN_PROFILE: ${{ inputs.maven-profile }}
        INPUT_EXTRA_ARGS: ${{ inputs.extra-args }}
        INPUT_DRY_RUN: ${{ inputs.dry-run }}
        INPUT_SERVER_ID: ${{ inputs.server-id }}
        INPUT_EXPECTED_VERSION: ${{ inputs.expected-version }}
        INPUT_REQUIRED_NOTICE_FILES: ${{ inputs.required-notice-files }}
        INPUT_CANONICAL_ROOT: ${{ inputs.canonical-root }}
      run: |
        python3 "$GITHUB_ACTION_PATH/scripts/deploy.py"
