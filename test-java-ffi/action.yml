name: Test Java Panama FFI Bindings
description: Install Java through mise, build the native library, and run the Java tests

inputs:
  ffi-crate-name:
    description: Cargo crate name for the FFI library
    required: true
  ffi-lib-name:
    description: Library name (without lib prefix or extension)
    required: true
  java-package-dir:
    description: Path to the Java package directory (relative to repo root)
    required: false
    default: "packages/java"
  java-version:
    description: >-
      Temurin Java version to install through mise (e.g. "25" selects the newest locked temurin-25). Empty uses the
      Java the caller's mise.toml selects.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Check for mise
      id: mise
      shell: bash
      run: echo "present=$(command -v mise >/dev/null 2>&1 && echo true || echo false)" >>"$GITHUB_OUTPUT"

    - name: Set up mise
      if: steps.mise.outputs.present != 'true'
      uses: xberg-io/actions/setup-mise@v1
      with:
        install: "false"

    - name: Install Java through mise
      shell: bash
      env:
        JAVA_SPEC: ${{ inputs.java-version != '' && format('temurin-{0}', inputs.java-version) || '' }}
        MISE_GITHUB_TOKEN: ${{ env.MISE_GITHUB_TOKEN || github.token }}
      run: bash "$GITHUB_ACTION_PATH/../setup-mise/scripts/install-tools.sh" . "java=$JAVA_SPEC"

    # ~keep The Maven repository cache setup-java's `cache: maven` kept, keyed the same way.
    - name: Cache the Maven repository
      uses: actions/cache@v6
      with:
        path: ~/.m2/repository
        key: setup-java-${{ runner.os }}-${{ runner.arch }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          setup-java-${{ runner.os }}-${{ runner.arch }}-maven-

    - name: Build native library
      shell: bash
      env:
        FFI_CRATE_NAME: ${{ inputs.ffi-crate-name }}
        FFI_LIB_NAME: ${{ inputs.ffi-lib-name }}
        JAVA_PACKAGE_DIR: ${{ inputs.java-package-dir }}
      run: |
        set -euo pipefail
        cargo build --locked --release --package "$FFI_CRATE_NAME"
        mkdir -p "$JAVA_PACKAGE_DIR/src/main/resources"
        if [[ "$RUNNER_OS" == "Windows" ]]; then
          cp "target/release/${FFI_LIB_NAME}.dll" "$JAVA_PACKAGE_DIR/src/main/resources/"
        elif [[ "$RUNNER_OS" == "macOS" ]]; then
          cp "target/release/lib${FFI_LIB_NAME}.dylib" "$JAVA_PACKAGE_DIR/src/main/resources/"
        else
          cp "target/release/lib${FFI_LIB_NAME}.so" "$JAVA_PACKAGE_DIR/src/main/resources/"
        fi

    - name: Run Java tests
      shell: bash
      working-directory: ${{ inputs.java-package-dir }}
      env:
        JAVA_PACKAGE_DIR: ${{ inputs.java-package-dir }}
      run: |
        set -euo pipefail
        if [[ "$RUNNER_OS" == "Windows" ]]; then
          export PATH="${GITHUB_WORKSPACE}/${JAVA_PACKAGE_DIR}/src/main/resources:${PATH}"
        fi
        MAVEN_OPTS="${MAVEN_OPTS:-} --enable-native-access=ALL-UNNAMED -Dsun.misc.unsafe.memory.access=allow" \
          mvn -B -f pom.xml -Dgpg.skip=true clean test
        echo "Java Panama FFI bindings test completed"
