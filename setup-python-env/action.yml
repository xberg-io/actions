name: Setup Python Environment
description: Install Python and uv through mise, and cache the local virtual environment
inputs:
  python-version:
    description: >-
      Python version to install through mise, e.g. "3.12"; it selects the newest locked match in the caller's
      mise locks. Empty uses the version the caller's mise.toml selects.
    required: false
    default: ""
  cache-prefix:
    description: Prefix for cache keys
    required: false
    default: python-dependencies
  install-command:
    description: Command to install dependencies (default installs deps without building the project)
    required: false
    default: "uv sync --all-extras --all-packages --group dev --no-install-project --no-install-workspace"
  preserve-pkg-config-path:
    description: Preserve PKG_CONFIG_PATH for OpenSSL after uv operations
    required: false
    default: "true"
outputs:
  python-version:
    description: Resolved Python version
    value: ${{ steps.python.outputs.version }}
  cache-hit:
    description: Whether the dependency cache was restored
    value: ${{ steps.cache-python.outputs.cache-hit }}
runs:
  using: composite
  steps:
    - name: Compute uv.lock hash
      id: uv-lock-hash
      shell: bash
      run: |
        bash "${GITHUB_ACTION_PATH}/scripts/uv-lock-hash.sh"

    - name: Check for mise
      id: mise
      shell: bash
      run: echo "present=$(command -v mise >/dev/null 2>&1 && echo true || echo false)" >>"$GITHUB_OUTPUT"

    - name: Set up mise
      if: steps.mise.outputs.present != 'true'
      uses: xberg-io/actions/setup-mise@v1
      with:
        install: "false"

    - name: Install Python and uv through mise
      shell: bash
      env:
        PYTHON_VERSION: ${{ inputs.python-version }}
        MISE_GITHUB_TOKEN: ${{ env.MISE_GITHUB_TOKEN || github.token }}
      run: bash "$GITHUB_ACTION_PATH/../setup-mise/scripts/install-tools.sh" . "python=$PYTHON_VERSION" uv

    - name: Resolve the Python version
      id: python
      shell: bash
      run: bash "${GITHUB_ACTION_PATH}/scripts/python-version.sh"

    - name: Cache Python dependencies
      id: cache-python
      uses: actions/cache@v6
      with:
        path: |
          ~/.cache/uv
          .venv
        key: ${{ inputs.cache-prefix }}-v2-${{ runner.os }}-${{ steps.python.outputs.version }}-${{ steps.uv-lock-hash.outputs.value }}
        restore-keys: |
          ${{ inputs.cache-prefix }}-v2-${{ runner.os }}-${{ steps.python.outputs.version }}-

    - name: Pin Python version for uv
      shell: bash
      env:
        PYTHON_VERSION: ${{ steps.python.outputs.version }}
      run: |
        bash "${GITHUB_ACTION_PATH}/scripts/pin-python.sh" "$PYTHON_VERSION"

    - name: Install Python dependencies
      shell: bash
      run: ${{ inputs.install-command }}

    - name: Add venv bin to PATH
      shell: bash
      run: |
        if [ -d ".venv/bin" ]; then
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
        fi

    - name: Preserve PKG_CONFIG_PATH for OpenSSL
      if: inputs.preserve-pkg-config-path == 'true'
      shell: bash
      run: |
        bash "${GITHUB_ACTION_PATH}/scripts/preserve-pkg-config-path.sh"
