name: Check toolchain
description: >-
  Fail when the repository's mise.toml drifts from the xberg-io/toolchains baseline named in its toolchains.toml.
  Runs on Linux and macOS runners; needs git and Python 3.11+.
inputs:
  working-directory:
    description: Repository root holding mise.toml and toolchains.toml.
    required: false
    default: "."
runs:
  using: composite
  steps:
    - name: Reject Windows runners
      if: runner.os == 'Windows'
      shell: bash
      run: |
        echo "::error::check-toolchain supports Linux and macOS runners only; run it in a Linux job" >&2
        exit 1

    - name: Check toolchain against the baseline
      if: runner.os != 'Windows'
      shell: bash
      env:
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: |
        "${{ github.action_path }}/scripts/check.sh" "$WORKING_DIRECTORY"
