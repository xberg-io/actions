name: Build WASM Package
description: Builds WebAssembly package and optionally creates tarball

inputs:
  crate-dir:
    description: Path to the WASM crate directory (relative to repo root)
    required: true
  build-command:
    description: Command to build the WASM bundle
    required: false
    default: "pnpm run build:all"
  pack-tarball:
    description: Whether to pack the result as a tarball
    required: false
    default: "false"
  wasm-pack-version:
    description: >-
      wasm-pack version to install through mise, matched against the caller's mise locks, or 'skip' to skip the
      install. Empty uses the version the caller's mise.toml selects (`"github:rustwasm/wasm-pack"`).
    required: false
    default: ""

outputs:
  tarball:
    description: Path to the packed tarball (if pack-tarball is true)
    value: ${{ steps.pack.outputs.tarball }}

runs:
  using: composite
  steps:
    - name: Check for mise
      id: mise
      if: inputs.wasm-pack-version != 'skip'
      shell: bash
      run: echo "present=$(command -v mise >/dev/null 2>&1 && echo true || echo false)" >>"$GITHUB_OUTPUT"

    - name: Set up mise
      if: inputs.wasm-pack-version != 'skip' && steps.mise.outputs.present != 'true'
      uses: xberg-io/actions/setup-mise@v1
      with:
        install: "false"

    - name: Install wasm-pack through mise
      if: inputs.wasm-pack-version != 'skip'
      shell: bash
      env:
        WASM_PACK_VERSION: ${{ inputs.wasm-pack-version }}
        MISE_GITHUB_TOKEN: ${{ env.MISE_GITHUB_TOKEN || github.token }}
      run: bash "$GITHUB_ACTION_PATH/../setup-mise/scripts/install-tools.sh" . "github:rustwasm/wasm-pack=$WASM_PACK_VERSION"

    - name: Build WASM bundle
      shell: bash
      working-directory: ${{ inputs.crate-dir }}
      run: |
        set -euo pipefail
        ${{ inputs.build-command }}

    - name: Pack WASM tarball
      if: inputs.pack-tarball == 'true'
      id: pack
      shell: bash
      env:
        CRATE_DIR: ${{ inputs.crate-dir }}
      run: |
        set -euo pipefail
        pushd "${CRATE_DIR}" >/dev/null
        WASM_TGZ=$(pnpm pack | tail -1)
        mv "$WASM_TGZ" "$GITHUB_WORKSPACE/$WASM_TGZ"
        popd >/dev/null
        echo "tarball=$GITHUB_WORKSPACE/$WASM_TGZ" >> "$GITHUB_OUTPUT"
