[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
maintainers = [
  { name = "Na'aman Hirschfeld", email = "naaman@xberg.io" },
  { name = "Tobias Perlstein", email = "tobias@xberg.io" },
]
authors = [
  { name = "Na'aman Hirschfeld", email = "naaman@xberg.io" },
  { name = "Tobias Perlstein", email = "tobias@xberg.io" },
]
name = "xberg-actions"
version = "0.0.0"
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[dependency-groups]
dev = ["pyrefly>=1.4.0", "pytest>=9.2.0", "pytest-mock>=3.17.0", "pyyaml>=6.0.3", "ruff>=0.17.3", "tomlkit>=0.15.2"]

[tool.hatch]
build.targets.wheel.packages = ["scripts"]

[tool.ruff]
target-version = "py310"
line-length = 120
format.docstring-code-line-length = 120
format.docstring-code-format = true
lint.select = ["ALL"]
lint.ignore = [
  "ANN401",
  "ASYNC109",
  "ASYNC110",
  "BLE001",
  "COM812",
  "CPY", # No copyright headers in this repo (matches poly.toml)
  "D100",
  "D104",
  "D107",
  "D205",
  "E501",
  "EM",
  "FBT",
  "FIX", # We allow todo and fixme comments
  "ISC001",
  "PD011",
  "PGH003",
  "PLR2004",
  "PLW0603",
  "S104",
  "S110",
  "S603",
  "TD", # We allow todo and fixme comments
  "TRY",
]
lint.per-file-ignores."**/scripts/**" = [
  "C901",
  "D101",
  "D102",
  "D103",
  "INP001",
  "PERF401",
  "PLC0415",
  "PLR0912",
  "PLR0915",
  "PLW2901",
  "S607",
  "SIM105",
  "T201",
]
lint.per-file-ignores."**/tests/**/*.*" = [
  "A005",
  "ANN",
  "ARG001",
  "ARG002",
  "ARG005",
  "ASYNC230",
  "BLE001",
  "D",
  "N806",
  "N815",
  "PD",
  "PGH003",
  "PLC",
  "PLR0915",
  "PLR2004",
  "PT006",
  "PT007",
  "PT013",
  "PT017",
  "PT031",
  "RUF012",
  "S",
  "SIM117",
  "SLF001",
]
lint.mccabe.max-complexity = 15
lint.pydocstyle.convention = "google"
lint.pylint.max-args = 10
lint.pylint.max-branches = 15
lint.pylint.max-returns = 10

[tool.pyproject-fmt]
keep_full_version = true
max_supported_python = "3.14"

[tool.pyrefly]
python-version = "3.10"
preset = "default"
project-excludes = ["tests/**", "**/tests/**"]
search-path = [
  "build-csharp-natives/scripts",
  "build-elixir-natives/scripts",
  "build-java-natives/scripts",
  "publish-github-release/scripts",
  "publish-homebrew-source-formulas/scripts",
  "publish-scoop-manifests/scripts",
  "publish-maven/scripts",
  "verify-package-contents/scripts",
]

[tool.pytest]
# Per-action tests/ directories are listed explicitly. They used to be invisible to CI, which is
# how test_upload_artifacts kept asserting an exit code the script had stopped returning. ~keep
ini_options.testpaths = [
  "tests",
  "check-r-package/tests",
  "publish-github-release/tests",
  "publish-homebrew-source-formulas/scripts",
  "publish-r-package/tests",
  "publish-maven/tests",
  "publish-hex/tests",
]
ini_options.norecursedirs = ["dist", "build", "*.egg"]
# Every tests/ dir carries an __init__.py, so under the default import mode they all resolve to
# the same `tests` package and only the root one is importable. importlib mode keys modules by
# path instead, which is what lets the per-action directories above be collected at all. ~keep
ini_options.addopts = "--import-mode=importlib"
