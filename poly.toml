  "as is",
  "without warranties",
  "specific language governing permissions",
  "limitations under the license",
]
[hooks]
stages = ["pre-commit"]
snapshot_include = [".venv"]

[hooks.builtin]
lint = { exclude = [
  "**/*.lock",
  "**/Cargo.lock",
  "**/go.sum",
  "**/package-lock.json",
  "**/pnpm-lock.yaml",
  "**/uv.lock",
  "crates/*-ffi/include/*.h",
  "packages/go/include/*.h",
  "/.ai-rulez/.generated-manifest.json",
] }
fmt = { exclude = [
  "**/*.lock",
  "**/Cargo.lock",
  "**/go.sum",
  "**/package-lock.json",
  "**/pnpm-lock.yaml",
  "**/uv.lock",
  "crates/*-ffi/include/*.h",
  "packages/go/include/*.h",
  "/.ai-rulez/.generated-manifest.json",
] }
commit = { stages = ["commit-msg"] }
file_safety = { exclude = [
  # Measured, not inherited: poly's check-shebang-scripts-are-executable reports a NEWLY ADDED
  # `.bats` file as non-executable even when it is staged 100755. A new `.sh` staged the same way
  # passes, and already-tracked `.bats` files pass, so it is specific to adding a `.bats`. Without
  # this entry every commit that introduces a suite is blocked by a false positive.
  # This exclude does NOT cost lint coverage -- poly has no engine for the .bats extension at all
  # (`poly lint x.bats` reports "no matching engine for this file type"), so these files were never
  # linted by poly either way. `task lint:bats` runs shfmt and shellcheck over them instead. ~keep
  "**/*.bats",
  "**/*.lock",
  "**/Cargo.lock",
  "**/go.sum",
  "**/package-lock.json",
  "**/pnpm-lock.yaml",
  "**/uv.lock",
  "crates/*-ffi/include/*.h",
  "packages/go/include/*.h",
  "CHANGELOG.md",
  "**/CHANGELOG.md",
  "install-bats/scripts/install.sh",
  "publish-maven/action.yml",
  "run-bats/scripts/run.sh",
  "/.ai-rulez/.generated-manifest.json",
] }

[tools.shfmt]
enabled = true

[tools.actionlint]
enabled = true

[hooks.pre-commit.commands.pyrefly]
run = "task typecheck"
files = "{**/*.py,**/pyrefly.toml,pyproject.toml,poly.toml,Taskfile.yml}"
exclude = ["tests/**", "**/tests/**"]
workspace = true
cache = { inputs = ["**/*.py", "**/pyrefly.toml", "pyproject.toml", "Taskfile.yml"] }
[[hooks.sources]]
id = "ai-rulez"
git = "https://github.com/Goldziher/ai-rulez.git"
revision = "v5.3.0"
hooks = ["ai-rulez-validate"]
