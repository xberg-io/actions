name: Setup ONNX Runtime
description: Download and stage ONNX Runtime libraries for bindings
inputs:
  ort-version:
    description: ONNX Runtime version to download
    required: true
  dest-dir:
    description: Directory (relative to workspace) where libraries should be copied
    required: true
  arch-id:
    description: Override architecture (x64|arm64). Defaults to runner architecture.
    required: false
    default: ""
  strategy:
    description: "ORT linking strategy: 'system' (dynamic link, default) or 'bundled' (static link via ort-bundled cargo feature)"
    required: false
    default: system
runs:
  using: composite
  steps:
    - name: Cache ONNX Runtime
      id: cache-onnx
      uses: actions/cache@v6
      with:
        path: |
          ${{ runner.temp }}/onnxruntime
        key: onnx-v2-${{ runner.os }}-${{ inputs.arch-id != '' && inputs.arch-id || runner.arch }}-${{ inputs.ort-version }}
        restore-keys: |
          onnx-v2-${{ runner.os }}-${{ inputs.arch-id != '' && inputs.arch-id || runner.arch }}-
          onnx-v2-${{ runner.os }}-

    - name: Prepare ONNX Runtime (Linux)
      if: runner.os == 'Linux'
      shell: bash
      env:
        ORT_VERSION: ${{ inputs.ort-version }}
        ORT_DEST_DIR: ${{ inputs.dest-dir }}
        ORT_ARCH_ID: ${{ inputs.arch-id }}
        ORT_STRATEGY: ${{ inputs.strategy }}
      run: '"$GITHUB_ACTION_PATH/scripts/linux.sh" "$ORT_VERSION" "$ORT_DEST_DIR" "$ORT_ARCH_ID" "$ORT_STRATEGY"'

    - name: Prepare ONNX Runtime (macOS)
      if: runner.os == 'macOS'
      shell: bash
      env:
        ORT_VERSION: ${{ inputs.ort-version }}
        ORT_DEST_DIR: ${{ inputs.dest-dir }}
        ORT_ARCH_ID: ${{ inputs.arch-id }}
        ORT_STRATEGY: ${{ inputs.strategy }}
      run: '"$GITHUB_ACTION_PATH/scripts/macos.sh" "$ORT_VERSION" "$ORT_DEST_DIR" "$ORT_ARCH_ID" "$ORT_STRATEGY"'

    - name: Prepare ONNX Runtime (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        ORT_VERSION: ${{ inputs.ort-version }}
        ORT_DEST_DIR: ${{ inputs.dest-dir }}
        ORT_ARCH_ID: ${{ inputs.arch-id }}
        ORT_STRATEGY: ${{ inputs.strategy }}
      run: >-
        & "$env:GITHUB_ACTION_PATH/scripts/windows.ps1"
        "$env:ORT_VERSION" "$env:ORT_DEST_DIR" "$env:ORT_ARCH_ID" "$env:ORT_STRATEGY"
