name: Publish Helm Chart
description: >
  Package and push a Helm chart to an OCI registry (GHCR, GAR, ECR, Docker Hub, etc.).
  Stamps the chart's version and appVersion in Chart.yaml before packaging. Idempotent:
  re-running with the same version exits 0 with skipped=true if the chart already exists.

inputs:
  chart-path:
    description: "Path to the chart directory (e.g. charts/my-chart)"
    required: true
  version:
    description: "Chart version (semver, no 'v' prefix). Example: 0.1.0 or 0.1.0-rc.1."
    required: true
  app-version:
    description: "App version stamped into Chart.yaml. Defaults to chart version."
    required: false
    default: ""
  registry:
    description: >
      OCI registry URL (e.g. oci://ghcr.io/my-org/charts). The host is extracted for
      `helm registry login`; the full URL is the push target.
    required: true
  username:
    description: "Registry username (e.g. github.actor for GHCR, oauth2accesstoken for GCP AR)"
    required: true
  password:
    description: "Registry password / token (e.g. GITHUB_TOKEN for GHCR)"
    required: true
  helm-version:
    description: >-
      Helm version to install through mise (e.g. v3.16.0), matched against the caller's mise locks. Empty uses
      the version the caller's mise.toml selects, or the helm this repository's mise.lock pins when it declares none.
    required: false
    default: ""
  dry-run:
    description: "If 'true', lint and package but skip registry login and push"
    required: false
    default: "false"

  working-directory:
    description: Directory holding the mise.toml and mise.lock that select the tool versions this installs.
    required: false
    default: "."

outputs:
  published:
    description: "'true' if the chart was pushed, 'false' if dry-run or skipped"
    value: ${{ steps.publish.outputs.published }}
  skipped:
    description: "'true' if the chart version already existed in the registry"
    value: ${{ steps.publish.outputs.skipped }}
  chart-tarball:
    description: "Absolute path to the packaged .tgz file"
    value: ${{ steps.publish.outputs.chart-tarball }}

runs:
  using: composite
  steps:
    - name: Check for mise
      id: mise
      shell: bash
      run: echo "present=$(command -v mise >/dev/null 2>&1 && echo true || echo false)" >>"$GITHUB_OUTPUT"

    - name: Set up mise
      if: steps.mise.outputs.present != 'true'
      uses: xberg-io/actions/setup-mise@v1
      with:
        working-directory: ${{ inputs.working-directory }}
        install: "false"

    # ~keep A caller without helm in mise.toml gets the helm this repository's mise.lock pins.
    - name: Install Helm through mise
      shell: bash
      env:
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
        HELM_VERSION: ${{ inputs.helm-version }}
        INSTALL_TOOLS_FALLBACK_ROOT: ${{ github.action_path }}/..
        MISE_GITHUB_TOKEN: ${{ env.MISE_GITHUB_TOKEN || github.token }}
      run: bash "${{ github.action_path }}/../setup-mise/scripts/install-tools.sh" "$WORKING_DIRECTORY" "helm=$HELM_VERSION"

    - name: Publish chart
      id: publish
      shell: bash
      env:
        INPUT_CHART_PATH: ${{ inputs.chart-path }}
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_APP_VERSION: ${{ inputs.app-version }}
        INPUT_REGISTRY: ${{ inputs.registry }}
        INPUT_USERNAME: ${{ inputs.username }}
        INPUT_PASSWORD: ${{ inputs.password }}
        INPUT_DRY_RUN: ${{ inputs.dry-run }}
      run: python3 "${GITHUB_ACTION_PATH}/scripts/publish.py"
