name: Setup Node.js Workspace
description: Install Node.js and pnpm through mise and install the workspace dependencies
inputs:
  node-version:
    description: >-
      Node.js version to install through mise, e.g. "24"; it selects the newest locked match in the caller's
      mise locks. Empty uses the version the caller's mise.toml selects.
    required: false
    default: ""
  frozen-lockfile:
    description: Use frozen lockfile for pnpm install
    required: false
    default: "false"
  ignore-scripts:
    description: >
      Skip running install scripts (e.g. native-binding postinstalls).
      Use when the workspace only needs JS tooling (lint, format) and not
      compiled native modules — avoids node-gyp builds that may fail on
      newer Node ABIs.
    required: false
    default: "false"
  registry-url:
    description: >-
      npm registry URL for authentication (e.g., https://registry.npmjs.org/). Writes an .npmrc in RUNNER_TEMP that
      reads the token from NODE_AUTH_TOKEN and exports it as NPM_CONFIG_USERCONFIG, as actions/setup-node did.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Check for mise
      id: mise
      shell: bash
      run: echo "present=$(command -v mise >/dev/null 2>&1 && echo true || echo false)" >>"$GITHUB_OUTPUT"

    - name: Set up mise
      if: steps.mise.outputs.present != 'true'
      uses: xberg-io/actions/setup-mise@v1
      with:
        install: "false"

    - name: Install Node.js and pnpm through mise
      shell: bash
      env:
        NODE_VERSION: ${{ inputs.node-version }}
        MISE_GITHUB_TOKEN: ${{ env.MISE_GITHUB_TOKEN || github.token }}
      run: bash "${{ github.action_path }}/../setup-mise/scripts/install-tools.sh" . "node=$NODE_VERSION" pnpm

    - name: Configure the npm registry
      if: inputs.registry-url != ''
      shell: bash
      env:
        REGISTRY_URL: ${{ inputs.registry-url }}
      run: bash "${{ github.action_path }}/scripts/configure-registry.sh" "$REGISTRY_URL"

    - name: Install dependencies
      shell: bash
      env:
        FROZEN_LOCKFILE: ${{ inputs.frozen-lockfile }}
        IGNORE_SCRIPTS: ${{ inputs.ignore-scripts }}
      run: |
        args=()
        if [ "$FROZEN_LOCKFILE" = "true" ]; then
          args+=(--frozen-lockfile)
        else
          # pnpm defaults frozen-lockfile=true in CI; pass the explicit negation
          # so `frozen-lockfile: false` is honored (e.g. napi workspaces whose
          # platform optionalDependencies pin a not-yet-published version that
          # cannot be recorded in the lockfile).
          args+=(--no-frozen-lockfile)
        fi
        if [ "$IGNORE_SCRIPTS" = "true" ]; then
          args+=(--ignore-scripts)
        fi
        pnpm install "${args[@]}"

    - name: Add pnpm bin to PATH
      shell: bash
      run: echo "$(pnpm bin)" >> "$GITHUB_PATH"
