name: Install Bats
description: Install Bats Core from an official GitHub release on Linux or macOS.
inputs:
  version:
    description: >-
      Bats version to install, with or without a leading "v". "latest" is still accepted, but it
      must now be typed: a floating default made every run's reproducibility depend on nobody
      omitting the input.
    required: false
    default: "1.14.0"
  install-dir:
    description: Directory in which to install the Bats release.
    required: false
    default: ""
  github-token:
    description: Token used to authenticate the GitHub release API lookup.
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Install Bats
      if: runner.os == 'Linux' || runner.os == 'macOS'
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_INSTALL_DIR: ${{ inputs.install-dir }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: bash "$GITHUB_ACTION_PATH/scripts/install.sh"

    - name: Reject unsupported runner
      if: runner.os != 'Linux' && runner.os != 'macOS'
      shell: bash
      run: |
        echo "::error::install-bats supports Linux and macOS runners only."
        exit 1
