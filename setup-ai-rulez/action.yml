name: Setup AI-Rulez
description: Install the latest AI-Rulez release through the upstream action, or build an immutable source revision.
inputs:
  ai-rulez-version:
    description: Deprecated and ignored; the latest release is always installed. A value other than "latest" warns.
    required: false
    default: "latest"
  source-revision:
    description: Optional full 40-character Goldziher/ai-rulez commit SHA to build instead of installing a release.
    required: false
    default: ""
  working-directory:
    description: Directory holding the mise.toml and mise.lock that select the tool versions this installs.
    required: false
    default: "."
runs:
  using: composite
  steps:
    - name: Check for mise
      id: mise
      shell: bash
      run: echo "present=$(command -v mise >/dev/null 2>&1 && echo true || echo false)" >>"$GITHUB_OUTPUT"
    - name: Set up mise
      if: steps.mise.outputs.present != 'true'
      uses: xberg-io/actions/setup-mise@v1
      with:
        working-directory: ${{ inputs.working-directory }}
        install: "false"
    # ~keep A caller whose mise config declares no uv, or that has no mise config, gets the uv this repository's
    # ~keep mise.lock pins.
    - name: Install uv through mise
      shell: bash
      env:
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
        INSTALL_TOOLS_FALLBACK_ROOT: ${{ github.action_path }}/..
        MISE_GITHUB_TOKEN: ${{ env.MISE_GITHUB_TOKEN || github.token }}
      run: bash "${{ github.action_path }}/../setup-mise/scripts/install-tools.sh" "$WORKING_DIRECTORY" uv
    - name: Warn on a deprecated AI-Rulez version
      if: inputs.ai-rulez-version != 'latest' && inputs.source-revision == ''
      shell: bash
      env:
        AI_RULEZ_VERSION: ${{ inputs.ai-rulez-version }}
      run: |
        echo "::warning title=setup-ai-rulez::ai-rulez-version is deprecated and ignored" \
          "(got '$AI_RULEZ_VERSION'); the latest AI-Rulez release is installed. Remove the input."
    - name: Install AI-Rulez release
      if: inputs.source-revision == ''
      # ~keep The upstream action installs a sha256-verified, cached release binary; `version: latest` resolves
      # ~keep GitHub's newest stable release. Its install script floats on the v5 major tag, as poly.toml's hook does.
      uses: Goldziher/ai-rulez@v5
      with:
        version: latest
    - name: Check out pinned AI-Rulez source
      if: inputs.source-revision != ''
      id: source
      shell: bash
      env:
        SOURCE_REVISION: ${{ inputs.source-revision }}
      run: |
        if [[ ! "$SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]; then
          echo "source-revision must be a full 40-character commit SHA" >&2
          exit 1
        fi
        source_directory=$(mktemp -d "$RUNNER_TEMP/ai-rulez-source.XXXXXX")
        git -C "$source_directory" init -q
        git -C "$source_directory" remote add origin https://github.com/Goldziher/ai-rulez.git
        git -C "$source_directory" fetch --depth=1 origin "$SOURCE_REVISION"
        git -C "$source_directory" -c advice.detachedHead=false checkout --detach FETCH_HEAD
        test "$(git -C "$source_directory" rev-parse HEAD)" = "$SOURCE_REVISION"
        echo "source-directory=$source_directory" >> "$GITHUB_OUTPUT"
    # ~keep The Go version comes from the AI-Rulez source being built, not the caller's mise.toml: its go.mod's
    # ~keep toolchain directive, else its go directive, as setup-go's go-version-file read it.
    - name: Read the Go version of the AI-Rulez source
      id: go
      if: inputs.source-revision != ''
      shell: bash
      env:
        SOURCE_DIRECTORY: ${{ steps.source.outputs.source-directory }}
      run: |
        go_mod="$SOURCE_DIRECTORY/go.mod"
        version="$(awk '$1 == "toolchain" { sub(/^go/, "", $2); print $2; exit }' "$go_mod")"
        [[ -n "$version" ]] || version="$(awk '$1 == "go" { print $2; exit }' "$go_mod")"
        if [[ -z "$version" ]]; then
          echo "::error::$go_mod declares no Go version" >&2
          exit 1
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"
        go_sum="$SOURCE_DIRECTORY/go.sum"
        digest="$( (sha256sum "$go_sum" 2>/dev/null || shasum -a 256 "$go_sum") | cut -d' ' -f1)"
        echo "go-sum=$digest" >> "$GITHUB_OUTPUT"
    - name: Install Go through mise for the source build
      if: inputs.source-revision != ''
      shell: bash
      env:
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
        GO_VERSION: ${{ steps.go.outputs.version }}
        MISE_GITHUB_TOKEN: ${{ env.MISE_GITHUB_TOKEN || github.token }}
      run: bash "${{ github.action_path }}/../setup-mise/scripts/install-tools.sh" "$WORKING_DIRECTORY" "go=$GO_VERSION"
    # ~keep The module and build caches setup-go's cache-dependency-path kept, keyed on the source's go.sum.
    - name: Cache Go modules for the source build
      if: inputs.source-revision != ''
      uses: actions/cache@v6
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
          ~/Library/Caches/go-build
        key: >-
          setup-ai-rulez-go-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.version }}-${{
          steps.go.outputs.go-sum }}
    - name: Build pinned AI-Rulez with static native dependencies
      if: inputs.source-revision != ''
      shell: bash
      working-directory: ${{ steps.source.outputs.source-directory }}
      # ~keep Upstream builds with go-task. Go installs that one pinned release, verified against the Go checksum
      # ~keep database, into a private directory so no task binary reaches later steps.
      env:
        GO_TASK_MODULE: github.com/go-task/task/v3/cmd/task@v3.54.0
      run: |
        task_bin=$(mktemp -d "$RUNNER_TEMP/go-task.XXXXXX")
        GOBIN="$task_bin" go install "$GO_TASK_MODULE"
        "$task_bin/task" build
        test -x bin/ai-rulez
        "$PWD/bin/ai-rulez" --version
        echo "$PWD/bin" >> "$GITHUB_PATH"
