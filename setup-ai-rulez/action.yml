name: Setup AI-Rulez
description: Install an AI-Rulez release (latest by default) through the upstream action, or build an immutable source revision.
inputs:
  ai-rulez-version:
    description: AI-Rulez release to install when source-revision is empty; "latest" installs the newest release.
    required: false
    default: "latest"
  source-revision:
    description: Optional full 40-character Goldziher/ai-rulez commit SHA to build instead of installing a release.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v10.3.3
    - name: Install AI-Rulez release
      if: inputs.source-revision == ''
      # ~keep The upstream action installs a sha256-verified, cached release binary; it publishes no floating major tag.
      # ~keep Its install script stays at this ref while the CLI floats: bump it with the ai-rulez hook revision in poly.toml.
      uses: Goldziher/ai-rulez@v5.9.2
      with:
        version: ${{ inputs.ai-rulez-version }}
    - name: Check out pinned AI-Rulez source
      if: inputs.source-revision != ''
      id: source
      shell: bash
      env:
        SOURCE_REVISION: ${{ inputs.source-revision }}
      run: |
        if [[ ! "$SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]; then
          echo "source-revision must be a full 40-character commit SHA" >&2
          exit 1
        fi
        source_directory=$(mktemp -d "$RUNNER_TEMP/ai-rulez-source.XXXXXX")
        git -C "$source_directory" init -q
        git -C "$source_directory" remote add origin https://github.com/Goldziher/ai-rulez.git
        git -C "$source_directory" fetch --depth=1 origin "$SOURCE_REVISION"
        git -C "$source_directory" -c advice.detachedHead=false checkout --detach FETCH_HEAD
        test "$(git -C "$source_directory" rev-parse HEAD)" = "$SOURCE_REVISION"
        echo "source-directory=$source_directory" >> "$GITHUB_OUTPUT"
    - name: Set up Go for source build
      if: inputs.source-revision != ''
      uses: actions/setup-go@v7
      with:
        go-version-file: ${{ steps.source.outputs.source-directory }}/go.mod
        cache-dependency-path: ${{ steps.source.outputs.source-directory }}/go.sum
    - name: Build pinned AI-Rulez with static native dependencies
      if: inputs.source-revision != ''
      shell: bash
      working-directory: ${{ steps.source.outputs.source-directory }}
      # ~keep Upstream builds with go-task. Go installs that one pinned release, verified against the Go checksum
      # ~keep database, into a private directory so no task binary reaches later steps.
      env:
        GO_TASK_MODULE: github.com/go-task/task/v3/cmd/task@v3.54.0
      run: |
        task_bin=$(mktemp -d "$RUNNER_TEMP/go-task.XXXXXX")
        GOBIN="$task_bin" go install "$GO_TASK_MODULE"
        "$task_bin/task" build
        test -x bin/ai-rulez
        "$PWD/bin/ai-rulez" --version
        echo "$PWD/bin" >> "$GITHUB_PATH"
