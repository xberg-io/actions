name: Publish to PyPI
description: >
  Publish Python packages to PyPI via uv's trusted-publishing (OIDC) flow.
  Avoids the pypa/gh-action-pypi-publish Docker action, which fails when
  invoked inside a composite action because it caches its image at
  ghcr.io/<composite-action-repo>:<ref> — a namespace the composite repo
  rarely has permission to publish/pull from.

inputs:
  packages-dir:
    description: "Directory containing wheel and sdist files"
    required: true
  dry-run:
    description: "Perform a dry run without publishing"
    required: false
    default: "false"
  repository-url:
    description: "Override the upload URL (e.g. https://test.pypi.org/legacy/)"
    required: false
    default: "https://upload.pypi.org/legacy/"
  expected-version:
    description: >
      Version of the release being published (a leading `v` is stripped). When set, every
      dist file must carry this version or the action fails. Leaving it empty preserves the
      old behaviour but disables the stale-artifact guard, and the action warns loudly.
    required: false
    default: ""

  fallback-index-url:
    description: "Optional public HTTPS simple index; verified quota-only fallback, never suppresses other failures"
    required: false
    default: ""

outputs:
  published:
    description: "Whether packages were published"
    value: ${{ steps.publish.outputs.published }}
  fallback:
    description: "Whether PyPI storage quota required the verified public archive"
    value: ${{ steps.upload.outputs.fallback }}
  skipped:
    description: "Whether the publish was skipped because every dist file was already on the registry"
    value: ${{ steps.validate.outputs.version_published }}

runs:
  using: composite
  steps:
    - name: Validate packages and check idempotency
      id: validate
      shell: bash
      env:
        INPUT_PACKAGES_DIR: ${{ inputs.packages-dir }}
        INPUT_DRY_RUN: ${{ inputs.dry-run }}
        INPUT_REPOSITORY_URL: ${{ inputs.repository-url }}
        INPUT_EXPECTED_VERSION: ${{ inputs.expected-version }}
      run: python3 "${{ github.action_path }}/scripts/publish.py"

    - name: Check for mise
      id: mise
      shell: bash
      run: echo "present=$(command -v mise >/dev/null 2>&1 && echo true || echo false)" >>"$GITHUB_OUTPUT"

    - name: Set up mise
      if: >-
        inputs.dry-run != 'true' && steps.validate.outputs.version_published != 'true' &&
        steps.mise.outputs.present != 'true'
      uses: xberg-io/actions/setup-mise@v1
      with:
        install: "false"

    - name: Install uv through mise
      if: inputs.dry-run != 'true' && steps.validate.outputs.version_published != 'true'
      shell: bash
      env:
        MISE_GITHUB_TOKEN: ${{ env.MISE_GITHUB_TOKEN || github.token }}
      run: bash "${{ github.action_path }}/../setup-mise/scripts/install-tools.sh" . uv

    - name: Publish to PyPI via trusted publishing
      id: upload
      if: inputs.dry-run != 'true' && steps.validate.outputs.version_published != 'true'
      shell: bash
      env:
        UV_PUBLISH_URL: ${{ inputs.repository-url }}
        PACKAGES_DIR: ${{ inputs.packages-dir }}
        INPUT_FALLBACK_INDEX_URL: ${{ inputs.fallback-index-url }}
      run: python3 "${{ github.action_path }}/scripts/upload.py"

    - name: Set output
      id: publish
      shell: bash
      env:
        VERSION_PUBLISHED: ${{ steps.validate.outputs.version_published }}
        PYPI_DRY_RUN: ${{ inputs.dry-run }}
        UPLOAD_PUBLISHED: ${{ steps.upload.outputs.published }}
      run: |
        if [ "$VERSION_PUBLISHED" = "true" ] || [ "$PYPI_DRY_RUN" = "true" ]; then
          echo "published=false" >> "$GITHUB_OUTPUT"
        else
          echo "published=$UPLOAD_PUBLISHED" >> "$GITHUB_OUTPUT"
        fi
