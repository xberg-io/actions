name: Install Task
description: >-
  Deprecated: declare `task` in mise.toml and use setup-mise instead. Installs the Task CLI through mise and puts
  it on PATH.
inputs:
  version:
    description: Task CLI version to install, with or without a leading "v". Use "latest" for the newest release.
    required: false
    default: "latest"
  install-dir:
    description: Directory where the task binary should be installed.
    required: false
    default: ""
  github-token:
    description: >-
      Token mise uses for the release lookup and download. Unauthenticated api.github.com allows 60
      requests/hour per runner IP, shared across every job on it, which makes resolving "latest"
      a routine CI flake.
    required: false
    default: ${{ github.token }}
runs:
  using: composite
  steps:
    # ~keep Only the mise binary: no install, no cache and no repository env or shims, so a mise.toml in
    # ~keep the caller's checkout is left for setup-mise to handle.
    - name: Install mise
      uses: jdx/mise-action@v5
      with:
        version: "2026.10.22"
        install: "false"
        cache: "false"
        env: "false"
        export_path: "false"
        add_shims_to_path: "false"
        github_token: ${{ inputs.github-token }}

    - name: Setup Task (Unix)
      if: runner.os != 'Windows'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        TASK_VERSION: ${{ inputs.version }}
        TASK_INSTALL_DIR: ${{ inputs.install-dir }}
      run: |
        "${{ github.action_path }}/scripts/unix.sh" "$TASK_VERSION" "$TASK_INSTALL_DIR"

    - name: Setup Task (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        TASK_VERSION: ${{ inputs.version }}
        TASK_INSTALL_DIR: ${{ inputs.install-dir }}
      run: |
        & '${{ github.action_path }}/scripts/windows.ps1' "$env:TASK_VERSION" "$env:TASK_INSTALL_DIR"
