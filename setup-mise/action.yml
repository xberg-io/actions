name: Setup mise
description: >-
  Install mise and the tools declared in the repository's mise.toml. When a mise.lock is present the install
  runs with --locked, so a lock that is stale or missing the runner's platform fails the job.
inputs:
  working-directory:
    description: Directory holding the mise.toml (and mise.lock) to install from.
    required: false
    default: "."
  install-args:
    description: >-
      Arguments passed to `mise install`, e.g. "node python" to install only those tools. Empty installs every
      tool in mise.toml.
    required: false
    default: ""
  install:
    description: >-
      "false" sets up mise and the config without installing any tool, for jobs whose `mise run` tasks need none.
    required: false
    default: "true"
  tools:
    description: >-
      Whitespace-separated tools to install instead of the whole config, each `tool` or `tool=version`, e.g.
      "python=3.12 uv". A tool without a version takes the version mise.toml selects and fails when it declares
      none; a version is matched against the active locks ("3.12" selects a locked 3.12.x) and installs unlocked,
      with a notice, when no lock covers it. The selected versions go first on PATH for later steps.
    required: false
    default: ""
  mise-env:
    description: >-
      Profile exported as MISE_ENV for this and later steps (e.g. "ci" loads mise.ci.toml and its mise.ci.lock).
    required: false
    default: ""
  github-token:
    description: >-
      Token mise uses for GitHub release lookups and downloads. Unauthenticated api.github.com allows 60
      requests/hour per runner IP, shared across every job on it.
    required: false
    default: ${{ github.token }}
  config-ref:
    description: >-
      Git ref to restore mise.toml, mise.lock and mise.*.toml / mise.*.lock from when the working directory has
      no mise.toml, e.g. a release job that checked out an older tag. Callers pass github.sha. Empty skips this.
    required: false
    default: ""
  cache:
    description: >-
      Cache the mise data directory, keyed on mise.toml, mise.*.toml, mise.lock and mise.*.lock, MISE_ENV, OS
      and arch. "auto" caches unless MISE_DATA_DIR is preset (a runner image's baked tools); "true" and "false"
      force it.
    required: false
    default: "auto"
outputs:
  cache:
    description: Whether the mise data directory was cached ("true" or "false"), after resolving "auto".
    value: ${{ steps.env.outputs.cache }}
runs:
  using: composite
  steps:
    - name: Restore mise config
      if: inputs.config-ref != ''
      shell: bash
      env:
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
        CONFIG_REF: ${{ inputs.config-ref }}
      run: |
        "$GITHUB_ACTION_PATH/scripts/restore-config.sh" "$WORKING_DIRECTORY" "$CONFIG_REF"

    - name: Prepare mise environment
      id: env
      shell: bash
      env:
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
        INPUT_MISE_ENV: ${{ inputs.mise-env }}
        INPUT_CACHE: ${{ inputs.cache }}
        INPUT_INSTALL: ${{ inputs.install }}
        INPUT_INSTALL_ARGS: ${{ inputs.install-args != '' && inputs.install-args || inputs.tools }}
      run: |
        "$GITHUB_ACTION_PATH/scripts/prepare-env.sh" "$WORKING_DIRECTORY" "$INPUT_MISE_ENV" "$INPUT_CACHE" \
          "$INPUT_INSTALL" "$INPUT_INSTALL_ARGS"

    - name: Install mise and tools
      uses: jdx/mise-action@v5
      with:
        version: "2026.10.24"
        working_directory: ${{ inputs.working-directory }}
        # ~keep `tools` installs exactly the tools it names in the next step, so the whole config is not installed
        # ~keep first unless install-args asks for some of it too.
        install: ${{ (inputs.tools == '' || inputs.install-args != '') && inputs.install || 'false' }}
        install_args: ${{ inputs.install-args }}
        github_token: ${{ inputs.github-token }}
        cache: ${{ steps.env.outputs.cache }}

    - name: Install the requested tools
      if: inputs.tools != '' && inputs.install == 'true'
      shell: bash
      env:
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
        INPUT_TOOLS: ${{ inputs.tools }}
        MISE_GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        read -r -a tools <<<"$(tr '\n' ' ' <<<"$INPUT_TOOLS")"
        bash "$GITHUB_ACTION_PATH/scripts/install-tools.sh" "$WORKING_DIRECTORY" "${tools[@]}"
