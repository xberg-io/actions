name: Setup textlint
description: >
  Install textlint plus the xberg-io standard rule set in one
  batched pnpm add into a runner-temp directory, put its binaries on
  PATH and export NODE_PATH to its node_modules. Pairs with a
  project-local `.textlintrc` and caller-provided runner script.

inputs:
  node-version:
    description: >-
      Node.js version to install through mise, matched against the caller's mise locks. Empty uses the version
      the caller's mise.toml selects.
    required: false
    default: ""
  extra-packages:
    description: "Whitespace-separated list of extra npm package specs to install alongside the standard set."
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Check for mise
      id: mise
      shell: bash
      run: echo "present=$(command -v mise >/dev/null 2>&1 && echo true || echo false)" >>"$GITHUB_OUTPUT"

    - name: Set up mise
      if: steps.mise.outputs.present != 'true'
      uses: xberg-io/actions/setup-mise@v1
      with:
        install: "false"

    - name: Install Node.js and pnpm through mise
      shell: bash
      env:
        NODE_VERSION: ${{ inputs.node-version }}
        MISE_GITHUB_TOKEN: ${{ env.MISE_GITHUB_TOKEN || github.token }}
      run: bash "$GITHUB_ACTION_PATH/../setup-mise/scripts/install-tools.sh" . "node=$NODE_VERSION" pnpm

    - name: Install textlint and rules
      shell: bash
      env:
        INPUT_EXTRA_PACKAGES: ${{ inputs.extra-packages }}
      run: bash "$GITHUB_ACTION_PATH/scripts/install.sh"
