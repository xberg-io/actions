name: Setup textlint
description: >
  Install textlint plus the xberg-io standard rule set in one
  batched pnpm add. Pairs with a project-local `.textlintrc` and
  caller-provided runner script.

inputs:
  node-version:
    description: "Node.js version to install via actions/setup-node."
    required: false
    default: "26"
  extra-packages:
    description: "Whitespace-separated list of extra npm package specs to install alongside the standard set."
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install pnpm 12
      shell: bash
      run: |
        npm install --global pnpm@12.11.2
        echo "PNPM_HOME=$RUNNER_TEMP/pnpm" >> "$GITHUB_ENV"
        # ~keep pnpm 12 links global binaries into $PNPM_HOME/bin and refuses to install unless that is on PATH.
        echo "$RUNNER_TEMP/pnpm/bin" >> "$GITHUB_PATH"

    - name: Install textlint and rules
      shell: bash
      env:
        INPUT_EXTRA_PACKAGES: ${{ inputs.extra-packages }}
      run: bash "${{ github.action_path }}/scripts/install.sh"
