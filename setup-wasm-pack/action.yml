name: Setup wasm-pack
description: >
  Install `wasm-pack` through mise, at the version the caller's mise.toml
  selects (declared as `"github:rustwasm/wasm-pack"`), and put it on PATH.

inputs:
  wasm-pack-version:
    description: >-
      wasm-pack version to install through mise (a leading 'v' is dropped), matched against the caller's mise
      locks. Empty uses the version the caller's mise.toml selects.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Check for mise
      id: mise
      shell: bash
      run: echo "present=$(command -v mise >/dev/null 2>&1 && echo true || echo false)" >>"$GITHUB_OUTPUT"

    - name: Set up mise
      if: steps.mise.outputs.present != 'true'
      uses: xberg-io/actions/setup-mise@v1
      with:
        install: "false"

    - name: Install wasm-pack through mise
      shell: bash
      env:
        WASM_PACK_VERSION: ${{ inputs.wasm-pack-version }}
        MISE_GITHUB_TOKEN: ${{ env.MISE_GITHUB_TOKEN || github.token }}
      run: bash "${{ github.action_path }}/../setup-mise/scripts/install-tools.sh" . "github:rustwasm/wasm-pack=$WASM_PACK_VERSION"
