name: Test setup-gradle
on:
  push:
    branches: [main]
    paths:
      - "setup-mise/scripts/install-tools.sh"
      - "setup-gradle/**"
      - ".github/workflows/test-setup-gradle.yml"
  pull_request:
    paths:
      - "setup-mise/scripts/install-tools.sh"
      - "setup-gradle/**"
      - ".github/workflows/test-setup-gradle.yml"

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # ~keep This repository's mise.toml declares neither Java nor Gradle, so both versions are passed.
      - name: Setup Gradle (with Java 21)
        uses: ./setup-gradle
        with:
          java-version: "21"
          gradle-version: "9.6.0"

      - name: Verify Gradle installation
        shell: bash
        run: gradle --version | tee /dev/stderr | grep -q "Gradle 9.6.0"

      - name: Verify Java installation
        shell: bash
        run: java -version 2>&1 | tee /dev/stderr | grep -q 'Temurin-21'
