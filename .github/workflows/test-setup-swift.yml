name: Test setup-swift
on:
  push:
    branches: [main]
    paths:
      - "setup-swift/**"
      - ".github/workflows/test-setup-swift.yml"
  pull_request:
    paths:
      - "setup-swift/**"
      - ".github/workflows/test-setup-swift.yml"

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Swift
        uses: ./setup-swift

      - name: Verify installation
        shell: bash
        run: swift --version
