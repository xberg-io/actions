name: Toolchain

on:
  pull_request:
    paths:
      - "mise.toml"
      - "mise.lock"
      - "mise.*.toml"
      - "mise.*.lock"
      - "toolchains.toml"
      - "mise-tasks/**"
      - "check-toolchain/**"
      - "setup-mise/**"
      - ".github/workflows/toolchain.yml"
  push:
    branches: [main]
    paths:
      - "mise.toml"
      - "mise.lock"
      - "mise.*.toml"
      - "mise.*.lock"
      - "toolchains.toml"
      - "mise-tasks/**"
      - "check-toolchain/**"
      - "setup-mise/**"
      - ".github/workflows/toolchain.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-toolchain:
    name: Toolchain baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./check-toolchain
      - name: Install from the lock
        uses: ./setup-mise
