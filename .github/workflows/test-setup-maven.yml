name: Test setup-maven
on:
  push:
    branches: [main]
    paths:
      - "setup-mise/scripts/install-tools.sh"
      - "setup-maven/**"
      - ".github/workflows/test-setup-maven.yml"
  pull_request:
    paths:
      - "setup-mise/scripts/install-tools.sh"
      - "setup-maven/**"
      - ".github/workflows/test-setup-maven.yml"

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # ~keep This repository's mise.toml declares neither Java nor Maven, so both versions are passed.
      - name: Setup Java (required by Maven 3.9+)
        uses: ./setup-mise
        with:
          tools: java=temurin-25

      - name: Setup Maven
        uses: ./setup-maven
        with:
          version: "3.9.11"

      - name: Verify Maven installation
        shell: bash
        run: |
          version="$(mvn --version)"
          echo "$version"
          grep -q "Apache Maven 3.9.11" <<<"$version"

      - name: Verify Java installation
        shell: bash
        run: java -version
