name: Test run-bats
on:
  push:
    branches: [main]
    paths:
      - "run-bats/**"
      - ".github/workflows/test-run-bats.yml"
  pull_request:
    paths:
      - "run-bats/**"
      - ".github/workflows/test-run-bats.yml"

permissions:
  contents: read

jobs:
  test:
    name: run-bats on ${{ matrix.os }}
    # ~keep macOS as well as ubuntu. /bin/bash there is 3.2, which is what
    # ~keep `#!/usr/bin/env bash` resolves to on a macOS runner, and expanding an empty array
    # ~keep under `set -u` is a fatal error on 3.2 but not on 4.4+. This job being
    # ~keep ubuntu-only is why run-bats shipped unable to run with its own default inputs
    # ~keep on any macOS consumer.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26]
    steps:
      - uses: actions/checkout@v7

      - name: Create an offline Bats shim and test fixture
        shell: bash
        run: |
          fixture_dir="${GITHUB_WORKSPACE}/.run-bats-fixture"
          shim_dir="${GITHUB_WORKSPACE}/.run-bats-bin"
          mkdir -p "${fixture_dir}/tests" "$shim_dir"
          touch "${fixture_dir}/tests/sample.bats"
          cat >"${shim_dir}/bats" <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          printf '%s\n' "$@" >"${GITHUB_WORKSPACE}/.run-bats-fixture/invocation.txt"
          SCRIPT
          chmod +x "${shim_dir}/bats"
          echo "$shim_dir" >>"$GITHUB_PATH"

      - name: Run a workspace-contained test path
        uses: ./run-bats
        with:
          path: .run-bats-fixture/tests
          args: |-
            --filter
            matching test

      # ~keep Exercises the action's OWN DEFAULT: action.yaml defaults `args` to "", and the
      # ~keep other steps here all pass args explicitly, so the empty-array expansion that
      # ~keep breaks on bash 3.2 was never reached by this workflow. Runs before the assertion
      # ~keep below because it overwrites the same invocation file.
      - name: Run with the default (empty) args
        uses: ./run-bats
        with:
          path: .run-bats-fixture/tests

      - name: Verify the default-args invocation reached bats
        shell: bash
        run: |
          invocation=.run-bats-fixture/invocation.txt
          test "$(sed -n '1p' "$invocation")" = "${GITHUB_WORKSPACE}/.run-bats-fixture/tests"
          test -z "$(sed -n '2p' "$invocation")"

      - name: Run a workspace-contained test path again for the splitting assertion
        uses: ./run-bats
        with:
          path: .run-bats-fixture/tests
          args: |-
            --filter
            matching test

      - name: Verify arguments were passed without word splitting
        shell: bash
        run: |
          invocation=.run-bats-fixture/invocation.txt
          test "$(sed -n '1p' "$invocation")" = "--filter"
          test "$(sed -n '2p' "$invocation")" = "matching test"
          test "$(sed -n '3p' "$invocation")" = "${GITHUB_WORKSPACE}/.run-bats-fixture/tests"
          test -z "$(sed -n '4p' "$invocation")"

      - name: Reject an external test path
        id: external-path
        continue-on-error: true
        uses: ./run-bats
        with:
          path: ../

      - name: Verify external test path was rejected
        shell: bash
        run: |
          test "${{ steps.external-path.outcome }}" = "failure"
