name: Test setup-node-workspace
on:
  push:
    branches: [main]
    paths:
      - "setup-mise/scripts/install-tools.sh"
      - "setup-node-workspace/**"
      - ".github/workflows/test-setup-node-workspace.yml"
  pull_request:
    paths:
      - "setup-mise/scripts/install-tools.sh"
      - "setup-node-workspace/**"
      - ".github/workflows/test-setup-node-workspace.yml"

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Create minimal package.json for test
        shell: bash
        run: |
          cat > package.json << 'JSON'
          {
            "name": "test-workspace",
            "private": true,
            "packageManager": "pnpm@12.15.0"
          }
          JSON
          cat > pnpm-lock.yaml << 'YAML'
          lockfileVersion: '9.0'
          settings:
            autoInstallPeers: true
          YAML

      # ~keep No node-version: the repository's mise.toml and mise.lock select Node and pnpm, as for a caller.
      - name: Setup Node workspace
        uses: ./setup-node-workspace
        with:
          frozen-lockfile: "false"
          registry-url: https://registry.npmjs.org

      - name: Verify installation
        shell: bash
        run: |
          set -euo pipefail
          node_version="$(node --version)"
          printf '%s\n' "$node_version" >&2
          grep -qx "v$(mise current node | cut -d' ' -f1)" <<<"$node_version"
          pnpm_version="$(pnpm --version)"
          printf '%s\n' "$pnpm_version" >&2
          grep -qx "$(mise current pnpm)" <<<"$pnpm_version"
          # shellcheck disable=SC2016 # the .npmrc holds the literal variable reference
          grep -qxF '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}' "$NPM_CONFIG_USERCONFIG"
          grep -qxF 'registry=https://registry.npmjs.org/' "$NPM_CONFIG_USERCONFIG"
          [[ "$NODE_AUTH_TOKEN" == "XXXXX-XXXXX-XXXXX-XXXXX" ]]
