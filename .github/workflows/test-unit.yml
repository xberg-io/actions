name: Unit tests

on:
  push:
    branches: [main]
    paths:
      - "**/scripts/**"
      - "tests/**"
      - "setup-ai-rulez/**"
      - "verify-ai-rulez-plugin/**"
      - "package-ai-rulez-plugin/**"
      - "**/tests/**"
      - ".ai-rulez/**"
      - "poly.toml"
      - "uv.lock"
      - "pyproject.toml"
      - "**/pyrefly.toml"
      - "Taskfile.yml"
      - ".github/workflows/reusable-validate.yml"
      - ".github/workflows/test-unit.yml"
  pull_request:
    paths:
      - "**/scripts/**"
      - "tests/**"
      - "setup-ai-rulez/**"
      - "verify-ai-rulez-plugin/**"
      - "package-ai-rulez-plugin/**"
      - "**/tests/**"
      - ".ai-rulez/**"
      - "poly.toml"
      - "uv.lock"
      - "pyproject.toml"
      - "**/pyrefly.toml"
      - "Taskfile.yml"
      - ".github/workflows/reusable-validate.yml"
      - ".github/workflows/test-unit.yml"

permissions:
  contents: read

jobs:
  pytest:
    name: pytest on ${{ matrix.os }}
    # ~keep Both runners, not just ubuntu. These suites cover scripts that build on macOS and
    # ~keep Linux runners alike, and a single-platform suite is how `setup-zig` (bash 3.2 on
    # ~keep macOS) and `build-swift-package` (GNU vs BSD stat on Linux) each stayed broken for
    # ~keep every consumer of one platform while CI stayed green. The Bats job already runs
    # ~keep both; this closes the same gap for Python.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.2

      - name: Install dependencies
        run: uv sync --group dev

      - uses: ./setup-ai-rulez
        with:
          ai-rulez-version: "latest"

      # No explicit path: an argument overrides `testpaths`, which is how the per-action
      # tests/ directories went uncollected for so long.
      - name: Run tests
        run: uv run pytest -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.2

      - name: Install dependencies
        run: uv sync --group dev

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - uses: ./install-task

      - name: Pyrefly
        run: task typecheck

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run actionlint
        uses: rhysd/actionlint@v1.7.12
