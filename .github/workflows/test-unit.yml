name: Unit tests

on:
  push:
    branches: [main]
    paths:
      - "**/scripts/**"
      - "tests/**"
      - "**/tests/**"
      - "pyproject.toml"
      - "Taskfile.yml"
      - ".github/workflows/reusable-validate.yml"
      - ".github/workflows/test-unit.yml"
  pull_request:
    paths:
      - "**/scripts/**"
      - "tests/**"
      - "**/tests/**"
      - "pyproject.toml"
      - "Taskfile.yml"
      - ".github/workflows/reusable-validate.yml"
      - ".github/workflows/test-unit.yml"

permissions:
  contents: read

jobs:
  pytest:
    name: pytest on ${{ matrix.os }}
    # ~keep Both runners, not just ubuntu. These suites cover scripts that build on macOS and
    # ~keep Linux runners alike, and a single-platform suite is how `setup-zig` (bash 3.2 on
    # ~keep macOS) and `build-swift-package` (GNU vs BSD stat on Linux) each stayed broken for
    # ~keep every consumer of one platform while CI stayed green. The Bats job already runs
    # ~keep both; this closes the same gap for Python.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0

      - name: Install dependencies
        run: uv sync --group dev

      # No explicit path: an argument overrides `testpaths`, which is how the per-action
      # tests/ directories went uncollected for so long.
      - name: Run tests
        run: uv run pytest -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0

      - name: Install dependencies
        run: uv sync --group dev

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      # Mirrors the pyrefly pre-commit hook in poly.toml, including the per-action
      # search paths that let sibling-module imports (e.g. musl_builder) resolve.
      - name: Pyrefly
        run: |
          uv run pyrefly check . \
            --project-excludes 'tests/**' \
            --project-excludes '**/tests/**' \
            --search-path build-csharp-natives/scripts \
            --search-path build-elixir-natives/scripts \
            --search-path build-java-natives/scripts \
            --search-path publish-github-release/scripts \
            --search-path publish-homebrew-source-formulas/scripts \
            --search-path publish-scoop-manifests/scripts

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run actionlint
        uses: rhysd/actionlint@v1.7.12
