name: Pester tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**/scripts/**"
      - "**/tests/**"
      - "install-pester/**"
      - "run-pester/**"
      - "Taskfile.yml"
      - ".github/workflows/test-pester.yml"
  pull_request:
    paths:
      - "**/scripts/**"
      - "**/tests/**"
      - "install-pester/**"
      - "run-pester/**"
      - "Taskfile.yml"
      - ".github/workflows/test-pester.yml"

permissions:
  contents: read

jobs:
  test:
    name: Pester on ${{ matrix.os }}
    # ~keep Windows is the real target -- every script under test is a `scripts/windows.ps1`
    # ~keep or the PHP build's Windows-only path rewriting. macOS is here for one specific
    # ~keep reason: 4 tests (2 in install-task, 2 in setup-zig) execute the unpacked binary
    # ~keep and are `-Skip:($IsWindows)`, because that needs a real PE on Windows while a
    # ~keep shebang stub only works on POSIX. On a Windows-only matrix those 4 would run on
    # ~keep no runner at all and still report green.
    runs-on: ${{ matrix.os }}
    # ~keep A cap so a stall fails with a log instead of sitting on a runner for the
    # ~keep 360-minute default. Set above the 846s a full Windows run currently takes --
    # ~keep 839s of which is install-system-deps alone, which is being fixed separately --
    # ~keep so a legitimate run is never cut off and the test results stay readable.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Pester
        uses: ./install-pester
        with:
          version: "6.2.0"

      - name: Run Pester tests
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Import-Module Pester -RequiredVersion 6.2.0 -Force
          $config = New-PesterConfiguration
          $config.Run.Path = '.'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          # ~keep A run that discovers zero tests exits 0 and would report this job green while
          # ~keep proving nothing -- the same shape as the pytest testpaths gap. Fail instead.
          $config.Run.Throw = $true
          Invoke-Pester -Configuration $config
