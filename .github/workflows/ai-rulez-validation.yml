name: AI-Rulez validation
on:
  push:
    branches: [main]
    paths:
      - ".ai-rulez/**"
      - "modules/**"
      - "plugin/**"
      - "skills/**"
      - ".agents/plugins/**"
      - ".claude-plugin/**"
      - ".codex/**"
      - "scripts/sync*"
      - "Cargo.toml"
      - "pyproject.toml"
      - "package.json"
      - ".gitignore"
      - ".github/workflows/ai-rulez-validation.yml"
      - ".github/workflows/reusable-ai-rulez-validation.yml"
      - "setup-ai-rulez/**"
      - "validate-ai-rulez/**"
      - "tests/test_validate_ai_rulez.py"
  pull_request:
    paths:
      - ".ai-rulez/**"
      - "modules/**"
      - "plugin/**"
      - "skills/**"
      - ".agents/plugins/**"
      - ".claude-plugin/**"
      - ".codex/**"
      - "scripts/sync*"
      - "Cargo.toml"
      - "pyproject.toml"
      - "package.json"
      - ".gitignore"
      - ".github/workflows/ai-rulez-validation.yml"
      - ".github/workflows/reusable-ai-rulez-validation.yml"
      - "setup-ai-rulez/**"
      - "validate-ai-rulez/**"
      - "tests/test_validate_ai_rulez.py"
permissions:
  contents: read
jobs:
  validate:
    uses: ./.github/workflows/reusable-ai-rulez-validation.yml
    with:
      budgets: |
        claude=4300
        codex=4800
