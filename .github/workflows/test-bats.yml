name: Bats tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**/scripts/**"
      - "**/tests/**"
      - "install-bats/**"
      - "run-bats/**"
      - "mise.toml"
      - "mise-tasks/**"
      - ".github/workflows/test-bats.yml"
  pull_request:
    paths:
      - "**/scripts/**"
      - "**/tests/**"
      - "install-bats/**"
      - "run-bats/**"
      - "mise.toml"
      - "mise-tasks/**"
      - ".github/workflows/test-bats.yml"

permissions:
  contents: read

# ~keep One declared version per side of the fence: the workflow passes it to install-bats and
# ~keep mise.toml names the same number, so a local run and a CI run agree instead of drifting apart.
env:
  BATS_VERSION: "1.14.0"

jobs:
  test:
    name: Bats on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26]
    steps:
      - uses: actions/checkout@v7

      - name: Install Bats
        uses: ./install-bats
        with:
          version: ${{ env.BATS_VERSION }}

      - name: Run Bash script tests
        uses: ./run-bats
        with:
          path: .
          lib-path: bats-lib
          args: |-
            --recursive
            --print-output-on-failure
