name: Test build-node-napi
on:
  push:
    paths:
      - "build-node-napi/**"
      - ".github/workflows/test-build-node-napi.yml"
  pull_request:
    paths:
      - "build-node-napi/**"
      - ".github/workflows/test-build-node-napi.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install pnpm
        shell: bash
        run: npm install --global pnpm@12

      - name: Stage a tiny NAPI-RS crate
        shell: bash
        run: |
          mkdir -p packages/node/src
          cat >pnpm-workspace.yaml <<'YAML'
          packages:
            - "packages/*"
          YAML
          cat >package.json <<'JSON'
          {
            "private": true,
            "packageManager": "pnpm@12.3.4"
          }
          JSON
          cat >packages/node/Cargo.toml <<'TOML'
          [package]
          name = "fixture-napi"
          version = "0.0.1"
          edition = "2021"
          publish = false

          [lib]
          crate-type = ["cdylib"]

          [dependencies]
          napi = { version = "2", default-features = false, features = ["napi4"] }
          napi-derive = "2"

          [build-dependencies]
          napi-build = "2"
          TOML
          cat >packages/node/build.rs <<'RS'
          fn main() { napi_build::setup(); }
          RS
          cat >packages/node/src/lib.rs <<'RS'
          #![deny(clippy::all)]
          use napi_derive::napi;

          #[napi]
          pub fn add(a: i32, b: i32) -> i32 { a + b }
          RS
          # TWO targets on purpose, while the job only ever BUILDS one. A single-target
          # fixture makes `napi artifacts` trivially satisfiable, which is exactly why
          # this suite stayed green while every consumer's Node publish leg failed with
          # "Missing artifacts for configured targets". Do not reduce this to one. ~keep
          cat >packages/node/package.json <<'JSON'
          {
            "name": "fixture-napi",
            "version": "0.0.1",
            "main": "index.js",
            "scripts": {
              "build": "napi build --platform --release"
            },
            "files": ["index.js", "index.d.ts", "*.node"],
            "napi": {
              "binaryName": "fixture-napi",
              "targets": [
                "x86_64-unknown-linux-gnu",
                "aarch64-unknown-linux-gnu",
                "x86_64-unknown-linux-musl"
              ]
            },
            "devDependencies": {
              "@napi-rs/cli": "^3.9.1"
            }
          }
          JSON
          cargo generate-lockfile --manifest-path packages/node/Cargo.toml

      - name: Build NAPI bindings via the action
        uses: ./build-node-napi
        with:
          crate-dir: packages/node
          build-command: "pnpm run build"

      - name: Verify .node artifact produced
        shell: bash
        run: |
          ls -la packages/node/
          test -n "$(ls packages/node/*.node 2>/dev/null)"

      - name: Build with cross-compile and verify platform subdirectory
        uses: ./build-node-napi
        with:
          crate-dir: packages/node
          target: x86_64-unknown-linux-gnu
          use-napi-cross: "true"

      - name: Verify platform subdirectory structure
        shell: bash
        run: |
          set -euo pipefail
          # This step used to `find | head` and echo a fallback message, so it passed
          # whether or not anything was staged. Assert on the count instead. ~keep
          staged=$(find packages/node/npm -name '*.node' -type f | wc -l | tr -d ' ')
          find packages/node/npm -type f
          if [ "${staged}" != "1" ]; then
            echo "::error::expected exactly 1 staged .node under npm/, found ${staged}"
            exit 1
          fi

      # The musl leg is the one that regressed: @napi-rs/cli 3.9.1 made `napi
      # artifacts` abort unless every target in `napi.targets` has a binary, which
      # no single matrix leg can satisfy. The fixture above declares three targets
      # and this job builds one, so a reintroduction fails here instead of in a
      # consumer's publish run. ~keep
      - name: Setup Zig
        uses: ./setup-zig
        with:
          version: "0.16.0"

      - name: Install musl target and cargo-zigbuild
        shell: bash
        run: |
          set -euo pipefail
          rustup target add x86_64-unknown-linux-musl
          command -v cargo-zigbuild || cargo install --locked cargo-zigbuild

      - name: Build with cross-compile (-x / cargo-zigbuild)
        uses: ./build-node-napi
        with:
          crate-dir: packages/node
          target: x86_64-unknown-linux-musl
          cross-compile: "true"
          install-deps: "false"

      - name: Verify the musl platform package holds a native module
        shell: bash
        run: |
          set -euo pipefail
          staged=$(find packages/node/npm -name '*.node' -type f | wc -l | tr -d ' ')
          find packages/node/npm -type f
          if [ "${staged}" != "1" ]; then
            echo "::error::expected exactly 1 staged .node after the musl build, found ${staged}"
            exit 1
          fi
          test -f packages/node/npm/linux-x64-musl/fixture-napi.linux-x64-musl.node

      # Negative control. A guard that never fires looks identical to one that is
      # wired up, so drive the invalid combination and assert the step FAILED. ~keep
      - name: Drive the rejected input combination
        id: bad-inputs
        continue-on-error: true
        uses: ./build-node-napi
        with:
          crate-dir: packages/node
          target: x86_64-unknown-linux-musl
          cross-compile: "true"
          use-napi-cross: "true"
          install-deps: "false"

      - name: Assert cross-compile + use-napi-cross was rejected
        shell: bash
        env:
          OUTCOME: ${{ steps.bad-inputs.outcome }}
        run: |
          set -euo pipefail
          if [ "${OUTCOME}" != "failure" ]; then
            echo "::error::expected the mutually-exclusive input guard to fail the step, got '${OUTCOME}'"
            exit 1
          fi
          echo "guard rejected the combination as expected"
