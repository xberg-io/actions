name: Test AI-Rulez plugin actions
on:
  push:
    branches: [main]
    paths:
      - "setup-ai-rulez/**"
      - "validate-ai-rulez/**"
      - "tests/test_validate_ai_rulez.py"
      - "verify-ai-rulez-plugin/**"
      - "package-ai-rulez-plugin/**"
      - "tests/test_ai_rulez_plugin.py"
      - "tests/fixtures/plugin-config.toml"
      - ".github/workflows/test-ai-rulez-plugin.yml"
  pull_request:
    paths:
      - "setup-ai-rulez/**"
      - "validate-ai-rulez/**"
      - "tests/test_validate_ai_rulez.py"
      - "verify-ai-rulez-plugin/**"
      - "package-ai-rulez-plugin/**"
      - "tests/test_ai_rulez_plugin.py"
      - "tests/fixtures/plugin-config.toml"
      - ".github/workflows/test-ai-rulez-plugin.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    # ~keep The suite runs against the latest ai-rulez that setup-ai-rulez installs; without this mise run
    # ~keep would put the mise.toml pin first on PATH and test that instead.
    env:
      MISE_DISABLE_TOOLS: github:Goldziher/ai-rulez
    steps:
      - uses: actions/checkout@v7
      - uses: ./setup-ai-rulez
        with:
          ai-rulez-version: "latest"
      - uses: ./setup-mise
      - name: Test real generation and release artifacts
        run: |
          mise run test:ai-rulez-plugin
          mise run test:ai-rulez-validation
