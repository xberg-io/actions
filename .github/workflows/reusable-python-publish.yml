name: Publish Python Package to PyPI

on:
  workflow_call:
    inputs:
      package-name:
        description: "Package name on PyPI (used for display only)"
        required: true
        type: string
      python-version:
        description: "Python version for building, matched against the caller's mise locks. Empty uses mise.toml's."
        required: false
        type: string
        default: ""

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/${{ inputs.package-name }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Python and uv through mise
        uses: xberg-io/actions/setup-mise@v1
        with:
          tools: python=${{ inputs.python-version }} uv

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.3
