name: Setup Maven
description: Install Maven through mise at the version the caller's mise.toml selects; Java must be set up first
inputs:
  version:
    description: >-
      Maven version to install through mise, matched against the caller's mise locks. Empty uses the version the
      caller's mise.toml selects.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Check for mise
      id: mise
      shell: bash
      run: echo "present=$(command -v mise >/dev/null 2>&1 && echo true || echo false)" >>"$GITHUB_OUTPUT"

    - name: Set up mise
      if: steps.mise.outputs.present != 'true'
      uses: xberg-io/actions/setup-mise@v1
      with:
        install: "false"

    - name: Install Maven through mise
      shell: bash
      env:
        MAVEN_VERSION: ${{ inputs.version }}
        MISE_GITHUB_TOKEN: ${{ env.MISE_GITHUB_TOKEN || github.token }}
      run: bash "$GITHUB_ACTION_PATH/../setup-mise/scripts/install-tools.sh" . "maven=$MAVEN_VERSION"

    - name: Show the Maven version
      shell: bash
      run: mvn --version
