name: Verify Package Contents
description: >
  Inspect a built package artifact (wheel, gem, npm tarball, jar, nupkg,
  crate, hex tarball, homebrew bottle, composer zip) and assert it ships
  the language-specific expected files: type stubs (.pyi, .d.ts, .rbs),
  marker files (py.typed), native binaries (.so/.dylib/.dll/.node) under
  the correct relative paths, plus LICENSE and README.

  This guards against publish-side regressions where a wheel ships without
  py.typed, an npm package without index.d.ts, a NuGet package missing the
  runtimes/<rid>/ layout, etc. Run inside the publish job, before the
  upload step, so a broken artifact fails fast.

inputs:
  language:
    description: >
      Language of the artifact. One of: python, node, wasm, ruby, java,
      csharp, php, elixir, go, rust, c, homebrew.
    required: true
  artifact-path:
    description: "Path to the artifact file (.whl, .gem, .tgz, .jar, .nupkg, .crate, .tar)"
    required: true
  package-name:
    description: >
      Expected package name (for cross-checking embedded metadata). Optional;
      most checks don't require it.
    required: false
    default: ""
  required-extras:
    description: >
      Newline-separated extra glob patterns that must also match in the
      artifact. Useful for project-specific files (e.g. a custom .so layout).
    required: false
    default: ""
  strict:
    description: "Fail on any allowlist miss (true) or warn only (false)."
    required: false
    default: "true"

  required-notice-files:
    description: >
      Opt-in newline-separated canonical notice paths relative to canonical-root.
      Every selected archive must contain identical bytes. Notice failures always fail,
      including when strict is false. Empty input preserves legacy file-list checks.
    required: false
    default: ""
  canonical-root:
    description: "Release source directory containing the canonical notice files."
    required: false
    default: "."
  artifact-format:
    description: >
      Notice archive format: wheel, sdist, gem, jar, nuget (or nupkg), hex, or auto.
      Empty means auto. Explicit formats filter directory scans by their archive extensions.
    required: false
    default: ""
  expected-artifact-count:
    description: >
      Exact positive number of selected archives required by the notice gate.
      Empty permits any nonzero count. Zero, whitespace and invalid counts fail.
    required: false
    default: ""

outputs:
  matched:
    description: "Number of allowlist patterns that matched at least one file."
    value: ${{ steps.verify.outputs.matched }}
  missing:
    description: "Newline-separated list of allowlist patterns with no matches."
    value: ${{ steps.verify.outputs.missing }}
  file-count:
    description: "Total number of files inspected in the artifact."
    value: ${{ steps.verify.outputs.file-count }}

runs:
  using: composite
  steps:
    - name: Check for mise
      id: mise
      if: inputs.required-notice-files != ''
      shell: bash
      run: echo "present=$(command -v mise >/dev/null 2>&1 && echo true || echo false)" >>"$GITHUB_OUTPUT"

    - name: Set up mise
      if: inputs.required-notice-files != '' && steps.mise.outputs.present != 'true'
      uses: xberg-io/actions/setup-mise@v1
      with:
        install: "false"

    # ~keep The notice check parses TOML with tomllib, which needs Python 3.11 or later; the runner's system
    # ~keep python3 may be older, so the caller's mise.toml Python is installed.
    - name: Install Python through mise for canonical notice verification
      if: inputs.required-notice-files != ''
      shell: bash
      env:
        MISE_GITHUB_TOKEN: ${{ env.MISE_GITHUB_TOKEN || github.token }}
      run: bash "${{ github.action_path }}/../setup-mise/scripts/install-tools.sh" . python

    - name: Verify package contents
      id: verify
      shell: bash
      env:
        INPUT_LANGUAGE: ${{ inputs.language }}
        INPUT_ARTIFACT_PATH: ${{ inputs.artifact-path }}
        INPUT_PACKAGE_NAME: ${{ inputs.package-name }}
        INPUT_REQUIRED_EXTRAS: ${{ inputs.required-extras }}
        INPUT_STRICT: ${{ inputs.strict }}
        INPUT_REQUIRED_NOTICE_FILES: ${{ inputs.required-notice-files }}
        INPUT_CANONICAL_ROOT: ${{ inputs.canonical-root }}
        INPUT_ARTIFACT_FORMAT: ${{ inputs.artifact-format }}
        INPUT_EXPECTED_ARTIFACT_COUNT: ${{ inputs.expected-artifact-count }}
      run: python3 "${{ github.action_path }}/scripts/verify.py"
