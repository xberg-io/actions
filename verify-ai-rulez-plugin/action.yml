name: Verify AI-Rulez Plugin
description: >
  Freshness gate for a coding-agent plugin generated by ai-rulez. Verifies the
  repo's version-sync script reports the plugin version tracking the core
  version, then byte-verifies the generated per-runtime bundles match their
  ai-rulez source config.

inputs:
  version-sync-script:
    description: >
      Path to the repo's plugin-version sync script. Must support a `--check`
      flag that exits non-zero on drift and does not write any files.
    required: false
    default: "scripts/sync_plugin_version.py"
  ai-rulez-version:
    description: >
      ai-rulez version to install via uvx for verification. Pin in lockstep
      with the version that generated the committed bundles.
    required: true
  working-directory:
    description: "Working directory for both commands"
    required: false
    default: "."

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v10.2.0

    - name: Verify plugin version tracks core
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        VERSION_SYNC_SCRIPT: ${{ inputs.version-sync-script }}
      run: python3 "$VERSION_SYNC_SCRIPT" --check

    - name: Verify generated plugin bundles are current
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        AI_RULEZ_VERSION: ${{ inputs.ai-rulez-version }}
      run: uvx "ai-rulez==$AI_RULEZ_VERSION" verify --recursive --plugin --if-configured
