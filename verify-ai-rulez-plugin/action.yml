name: Verify AI-Rulez Plugin
description: Verify plugin versions, strict validity, freshness and provenance using an installed AI-Rulez CLI.
inputs:
  ai-rulez-version:
    description: Optional legacy release install; omit when setup-ai-rulez already installed a pinned CLI.
    required: false
    default: ""
  version-sync-script:
    description: Plugin version sync script supporting a read-only --check flag.
    required: false
    default: "scripts/sync_plugin_version.py"
  config-directory:
    description: Explicit plugin authoring configuration directory relative to working-directory.
    required: false
    default: ".ai-rulez"
  working-directory:
    description: Working directory for verification commands.
    required: false
    default: "."
runs:
  using: composite
  steps:
    - name: Install uv for a legacy caller
      if: inputs.ai-rulez-version != ''
      uses: astral-sh/setup-uv@v10.3.0
    - name: Install the legacy caller's pinned AI-Rulez release
      if: inputs.ai-rulez-version != ''
      shell: bash
      env:
        AI_RULEZ_VERSION: ${{ inputs.ai-rulez-version }}
      run: |
        uv tool install --force "ai-rulez==$AI_RULEZ_VERSION"
        uv tool dir --bin >> "$GITHUB_PATH"
    - name: Verify plugin version tracks core
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        VERSION_SYNC_SCRIPT: ${{ inputs.version-sync-script }}
      run: python3 "$VERSION_SYNC_SCRIPT" --check
    - name: Verify generated plugin bundles are current
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        CONFIG_DIRECTORY: ${{ inputs.config-directory }}
      run: |
        test -n "$CONFIG_DIRECTORY"
        test -f "$CONFIG_DIRECTORY/config.toml"
        ai-rulez -C "$CONFIG_DIRECTORY" validate --strict
        ai-rulez -C "$CONFIG_DIRECTORY" verify --plugin
