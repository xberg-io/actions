name: Build Python Wheels
description: Build Python wheels using cibuildwheel

inputs:
  python-version:
    description: >-
      Python version for the cibuildwheel host, installed through mise and matched against the caller's mise
      locks. Empty uses the version the caller's mise.toml selects.
    required: false
    default: ""
  package-dir:
    description: Path to the Python package directory (relative to repo root)
    required: false
    default: "packages/python"
  cibw-build:
    description: CIBW_BUILD filter
    required: false
    default: "cp310-* cp311-* cp312-* cp313-* cp314-*"
  cibw-skip:
    description: CIBW_SKIP filter
    required: false
    default: "*-musllinux* *-win32 *-manylinux_i686"
  cibw-before-build-linux:
    description: CIBW_BEFORE_BUILD_LINUX command
    required: false
    default: "pip install maturin uv && source ~/.cargo/env"
  cibw-before-build-macos:
    description: CIBW_BEFORE_BUILD_MACOS command
    required: false
    default: "pip install maturin uv && source ~/.cargo/env"
  cibw-before-build-windows:
    description: CIBW_BEFORE_BUILD_WINDOWS command
    required: false
    default: "pip install maturin uv && set PATH=%USERPROFILE%\\.cargo\\bin;%PATH%"
  cibw-environment:
    description: CIBW_ENVIRONMENT (Linux default)
    required: false
    default: 'MATURIN_BUILD_ARGS="--compatibility linux" CARGO_BUILD_LOCKED=true'
  cibw-environment-windows:
    description: CIBW_ENVIRONMENT_WINDOWS
    required: false
    default: 'MATURIN_BUILD_ARGS="" CARGO_BUILD_LOCKED=true'
  cibw-environment-macos:
    description: CIBW_ENVIRONMENT_MACOS
    required: false
    default: 'MATURIN_BUILD_ARGS="" CARGO_BUILD_LOCKED=true'
  artifact-name:
    description: Name for the uploaded artifact (must be passed explicitly, e.g. wheels-Linux)
    required: false
    default: ""
  upload-artifact:
    description: Whether to upload the wheels as an artifact
    required: false
    default: "true"
  manylinux-x86_64-image:
    description: CIBW_MANYLINUX_X86_64_IMAGE (e.g. manylinux2014, manylinux_2_28)
    required: false
    default: "manylinux2014"
  manylinux-aarch64-image:
    description: CIBW_MANYLINUX_AARCH64_IMAGE
    required: false
    default: "manylinux2014"
  build-libheif:
    description: >
      Build and install libheif 1.23.7 with libde265 1.1.3 and libaom 3.15.2 in the manylinux
      container before building wheels. Required only by libheif-sys consumers
      (e.g. xberg). Opt-in — defaults to off so consumers that do not link
      libheif are not coupled to its system dependencies.
    required: false
    default: "false"

outputs:
  artifact-name:
    description: Name of the uploaded artifact
    value: ${{ steps.artifact.outputs.name }}

runs:
  using: composite
  steps:
    - name: Check for mise
      id: mise
      shell: bash
      run: echo "present=$(command -v mise >/dev/null 2>&1 && echo true || echo false)" >>"$GITHUB_OUTPUT"

    - name: Set up mise
      if: steps.mise.outputs.present != 'true'
      uses: xberg-io/actions/setup-mise@v1
      with:
        install: "false"

    - name: Install Python through mise
      shell: bash
      env:
        PYTHON_VERSION: ${{ inputs.python-version }}
        MISE_GITHUB_TOKEN: ${{ env.MISE_GITHUB_TOKEN || github.token }}
      run: bash "${{ github.action_path }}/../setup-mise/scripts/install-tools.sh" . "python=$PYTHON_VERSION"

    - name: Install cibuildwheel
      shell: bash
      run: python -m pip install cibuildwheel==3.2.0

    # build-libheif gates a large privileged-looking shell block (yum/dnf install, curl,
    # cmake/make as root inside the manylinux container) in CIBW_BEFORE_ALL_LINUX below.
    # It is documented as a strict boolean, so validate it as one before anything else
    # touches it — belt-and-suspenders alongside routing it through a real env var
    # instead of a YAML-level splice (see the CIBW_BEFORE_ALL_LINUX comment). ~keep
    - name: Validate build-libheif
      shell: bash
      env:
        BUILD_LIBHEIF: ${{ inputs.build-libheif }}
      run: |
        set -euo pipefail
        if [[ "$BUILD_LIBHEIF" != "true" && "$BUILD_LIBHEIF" != "false" ]]; then
          echo "::error::build-libheif must be 'true' or 'false', got: $BUILD_LIBHEIF" >&2
          exit 1
        fi

    - name: Resolve linker for native arm64 builds
      id: linker-config
      shell: bash
      run: |
        # `runner.arch` returns ARM64/X64 (uppercase) per GitHub Actions docs,
        # so the previous lowercase comparison silently fell through and never
        # exported the linker override. Use a case-insensitive shell compare.
        arch_lower="$(echo "${{ runner.arch }}" | tr '[:upper:]' '[:lower:]')"
        if [[ "$arch_lower" == "arm64" && "${{ runner.os }}" == "Linux" ]]; then
          echo "linker-env=CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=gcc" >> "$GITHUB_OUTPUT"
        else
          echo "linker-env=" >> "$GITHUB_OUTPUT"
        fi

    - name: Build wheels
      shell: bash
      run: python -m cibuildwheel --output-dir wheelhouse "$PACKAGE_DIR"
      env:
        PACKAGE_DIR: ${{ inputs.package-dir }}
        CIBW_BUILD: ${{ inputs.cibw-build }}
        # build-libheif must reach the manylinux container as a real environment
        # variable, never as literal text baked into the CIBW_BEFORE_ALL_LINUX script.
        # `${{ inputs.build-libheif }}` is a YAML-level substitution performed by GitHub
        # Actions before this step (or the container) even exists, so splicing it
        # directly into the script string here would let a value containing shell
        # metacharacters run as part of that script the same way it would in a `run:`
        # block — the container boundary doesn't help, because the injection would
        # already be baked into the text before the container starts. BUILD_LIBHEIF is
        # instead set as an ordinary env var (already validated above) and forwarded
        # into the Linux container unmodified via CIBW_ENVIRONMENT_PASS_LINUX, which
        # cibuildwheel documents for exactly this purpose; the script below reads it as
        # a real shell variable, evaluated only inside the container's own shell. ~keep
        BUILD_LIBHEIF: ${{ inputs.build-libheif }}
        CIBW_ENVIRONMENT_PASS_LINUX: BUILD_LIBHEIF
        CIBW_BEFORE_ALL_LINUX: >
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y &&
          source ~/.cargo/env &&
          if [ "$BUILD_LIBHEIF" = "true" ]; then
          PKG=$(command -v dnf >/dev/null && echo dnf || echo yum) &&
          $PKG install -y cmake gcc-c++ nasm numactl-devel &&
          for codec in libdav1d-devel x265-devel; do $PKG install -y "$codec" || true; done &&
          NATIVE_WORK=$(mktemp -d) &&
          trap 'rm -rf "$NATIVE_WORK"' EXIT &&
          build_native() {
          local name="$1" version="$2" url="$3" sha256="$4"; shift 4;
          curl -fsSL -o "$NATIVE_WORK/$name.tar.gz" "$url" &&
          printf '%s  %s\n' "$sha256" "$NATIVE_WORK/$name.tar.gz" | sha256sum -c - &&
          tar -xzf "$NATIVE_WORK/$name.tar.gz" -C "$NATIVE_WORK" &&
          cmake -S "$NATIVE_WORK/$name-$version" -B "$NATIVE_WORK/$name-build" -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr/local -DCMAKE_INSTALL_LIBDIR=lib "$@" &&
          cmake --build "$NATIVE_WORK/$name-build" -j"${CMAKE_BUILD_PARALLEL_LEVEL:-$(nproc)}" &&
          cmake --install "$NATIVE_WORK/$name-build";
          } &&
          build_native libde265 1.1.3 https://github.com/strukturag/libde265/releases/download/v1.1.3/libde265-1.1.3.tar.gz 554228bd17788c99a7e63b37ab5634722190e6e2bf60c1dcb01cef328e133905 -DBUILD_SHARED_LIBS=ON -DENABLE_SDL=OFF &&
          build_native libaom 3.15.2 https://storage.googleapis.com/aom-releases/libaom-3.15.2.tar.gz 67bb54b245f33ed98600e08269e6139986e48114e14042474ddd8885801dfddc -DBUILD_SHARED_LIBS=ON -DENABLE_APPS=OFF -DENABLE_EXAMPLES=OFF -DENABLE_TESTS=OFF -DENABLE_DOCS=OFF -DENABLE_TOOLS=OFF &&
          export PKG_CONFIG_PATH=/usr/local/lib/pkgconfig &&
          build_native libheif 1.23.7 https://github.com/strukturag/libheif/releases/download/v1.23.7/libheif-1.23.7.tar.gz f7483e818503ea6224c8863e4a56ac02c7089021a98472c811c12aa19faf2475 -DWITH_EXAMPLES=OFF -DWITH_GDK_PIXBUF=OFF -DBUILD_TESTING=OFF &&
          ldconfig &&
          test "$(pkg-config --modversion libheif)" = 1.23.7 &&
          test "$(pkg-config --modversion libde265)" = 1.1.3 &&
          test "$(pkg-config --modversion aom)" = 3.15.2;
          fi
        CIBW_BEFORE_ALL_MACOS: >
          rm -rf ~/.cargo ~/.rustup &&
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none --profile default &&
          source ~/.cargo/env &&
          CHANNEL="$(sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' "${GITHUB_WORKSPACE:-.}/rust-toolchain.toml" | head -n1)" &&
          rustup toolchain install "${CHANNEL:-stable}" --profile default &&
          rustup default "${CHANNEL:-stable}"
        CIBW_BEFORE_ALL_WINDOWS: >
          curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y &&
          refreshenv
        CIBW_BEFORE_BUILD_LINUX: ${{ inputs.cibw-before-build-linux }}
        CIBW_BEFORE_BUILD_MACOS: ${{ inputs.cibw-before-build-macos }}
        CIBW_BEFORE_BUILD_WINDOWS: ${{ inputs.cibw-before-build-windows }}
        CIBW_BUILD_FRONTEND: build
        CIBW_ENVIRONMENT: ${{ inputs.cibw-environment }} ${{ steps.linker-config.outputs.linker-env }}
        CIBW_ENVIRONMENT_WINDOWS: ${{ inputs.cibw-environment-windows }}
        CIBW_ENVIRONMENT_MACOS: ${{ inputs.cibw-environment-macos }}
        CIBW_SKIP: ${{ inputs.cibw-skip }}
        CIBW_MANYLINUX_X86_64_IMAGE: ${{ inputs.manylinux-x86_64-image }}
        CIBW_MANYLINUX_AARCH64_IMAGE: ${{ inputs.manylinux-aarch64-image }}

    - name: Determine artifact name
      if: inputs.upload-artifact == 'true'
      id: artifact
      shell: bash
      env:
        ARTIFACT_NAME: ${{ inputs.artifact-name }}
      run: |
        NAME="$ARTIFACT_NAME"
        if [[ -z "$NAME" ]]; then
          NAME="wheels-${RUNNER_OS}"
        fi
        echo "name=$NAME" >> "$GITHUB_OUTPUT"

    - name: Upload wheels
      if: inputs.upload-artifact == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.artifact.outputs.name }}
        path: ./wheelhouse/*.whl
        retention-days: 7
