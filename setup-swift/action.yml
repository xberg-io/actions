name: Setup Swift
description: >
  Install the Swift toolchain across Linux (including ubuntu-24.04-arm), macOS,
  and Windows. Wraps SwiftyLab/setup-swift, which supports aarch64 Linux
  runners (where swift-actions/setup-swift@v2 currently returns a corrupted
  binary). No-ops if `swift` is already on PATH.

inputs:
  swift-version:
    description: "Swift version to install (e.g. '6.0')"
    required: false
    default: "6.0"

runs:
  using: composite
  steps:
    - name: Check existing Swift
      id: existing
      shell: bash
      run: |
        if command -v swift >/dev/null 2>&1; then
          echo "Swift already installed: $(swift --version | head -n1)"
          echo "installed=true" >> "$GITHUB_OUTPUT"
        else
          echo "installed=false" >> "$GITHUB_OUTPUT"
        fi

    # ~keep The only floating action reference left in this repository. `latest` is a real,
    # separately-maintained tag in SwiftyLab/setup-swift -- a distinct tag object from v1.14.0 --
    # so it moves on the upstream maintainer's schedule and offered no protection against a bad
    # push or a compromised account. Both currently dereference to the same commit, so this pin
    # changes nothing about what runs today; it only stops the ref moving underneath us.
    # Audited 2026-09-13: v1.14.0 is the newest non-prerelease (2026-04-27), its annotated tag
    # object 76e3e48ac9c85b393a30adefd96afe0395b23c29 carries a GitHub-verified signature, and it
    # points at the commit pinned below. Re-audit when bumping.
    - name: Install Swift via SwiftyLab/setup-swift
      if: steps.existing.outputs.installed != 'true'
      uses: SwiftyLab/setup-swift@v1
      with:
        swift-version: ${{ inputs.swift-version }}
